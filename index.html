<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3b3247"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Casita"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Casita — juego de construir y vivir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a3a;--sub:#6f6880;--glass:rgba(255,253,248,.86);--line:rgba(60,45,80,.10);--accent:#e8794f;--accent2:#3fa7a2;--ok:#4cae7a;--warn:#e3b341;--bad:#d9605a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f1;font-family:Nunito,system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 4px 14px rgba(30,20,50,.10)}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;align-items:center;z-index:5;pointer-events:none}
.pill{pointer-events:auto;border-radius:14px;padding:6px 11px;font-weight:900;font-size:14px;white-space:nowrap}
#status{display:flex;gap:8px;align-items:center}
#money{color:#2f8a5a;transition:transform .15s;display:inline-block}
#money.bump{transform:scale(1.15)}
#clock{color:var(--sub);font-weight:800}
.spacer{flex:1}
.speed{display:flex;gap:1px;padding:3px}
.speed button{border:0;background:transparent;font-size:12px;padding:5px 7px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:900;color:var(--sub)}
.speed button.on{background:var(--ink);color:#fff}
#needs{position:fixed;top:52px;left:8px;z-index:5;border-radius:16px;padding:6px 10px 6px 6px;width:min(300px,calc(100vw - 64px));cursor:pointer;display:flex;gap:8px;align-items:center}
#hudpor,.mhead canvas,.crepre canvas{position:static;inset:auto}
#placebtn{position:fixed;top:112px;left:8px;z-index:5;border:0;border-radius:14px;padding:7px 12px;font-family:inherit;font-weight:900;font-size:12.5px;color:var(--ink);cursor:pointer;display:none;max-width:calc(100vw - 72px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#placebtn.on{display:block}

#dlg{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(30,20,40,.35);z-index:60;padding:12px}
.dlgc{background:#fffdf8;border-radius:20px;max-width:400px;width:100%;padding:16px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:85vh;overflow:auto}
.dlgt{font-weight:900;font-size:17px;color:#3b3247;margin-bottom:6px}.dlgx{font-size:13.5px;color:#4b4257;line-height:1.4;margin-bottom:10px}
.dlgb{display:block;width:100%;text-align:left;border:0;background:#f1ebe2;border-radius:14px;padding:10px 12px;margin:6px 0;font-family:inherit;cursor:pointer;color:#3b3247}
.dlgb b{font-size:13.5px}.dlgb small{display:block;font-size:11.5px;color:#7a6f86;margin-top:2px}.dlgb:disabled{opacity:.45;cursor:default}.dlgb:not(:disabled):active{background:#e4dbf3}
.dlgf{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:#7a6f86;font-weight:700;gap:8px}
.hbs{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0}.hb{font-size:10px;font-weight:800;background:#f6e1dc;color:#8a3b2e;border-radius:8px;padding:1px 6px}.hb.pos{background:#dff1e4;color:#2e6b43}
.rfs{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}.rfsl{display:flex;flex-direction:column;font-size:11px;font-weight:700;color:#6a5f76}.rfsl input{width:100%;accent-color:#7a6fd0}
#hudpor{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:linear-gradient(#fde9d8,#e6dcf3);box-shadow:inset 0 0 0 1px var(--line)}
.hcol{flex:1;min-width:0}
#hname{font-weight:900}
#line{font-size:11px;font-weight:700;font-style:italic;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#line:empty{display:none}
#needs .head{display:flex;align-items:center;gap:7px;font-weight:900;font-size:13px}
#needs .head .mood{font-size:18px}
#needs .head .act{font-weight:700;font-size:11.5px;color:var(--sub);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rings{display:flex;justify-content:space-between;margin-top:6px}
.ring{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(60,45,80,.10) 0)}
.ring span{width:25px;height:25px;border-radius:50%;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-size:13px}
#needs .grid{display:none;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px}
#needs.open .grid{display:grid}
#needs.open #rings{display:none}
.need{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800}
.need .lbl{width:62px;white-space:nowrap}
.bar{flex:1;height:7px;background:rgba(60,45,80,.10);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
#side{position:fixed;right:8px;top:52px;z-index:5;display:flex;flex-direction:column;gap:6px}
#side .pill{padding:0;font-size:17px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:13px}
#zin,#zout{display:none!important}
.badge{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;display:none}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 8px 8px}
#cats{display:flex;gap:5px;align-items:center;padding:0 2px 2px;overflow-x:auto;scrollbar-width:none}
#cats::-webkit-scrollbar{display:none}
#cats:empty{display:none}
.cat{white-space:nowrap;flex:0 0 auto;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:11px;padding:5px 9px;font-family:inherit;font-weight:800;font-size:11.5px;color:var(--ink);cursor:pointer}
.cat.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat.ur{padding:5px 9px;font-size:14px}
.cat:disabled{opacity:.35}
#palette{display:flex;gap:6px;overflow-x:auto;padding:5px 2px 6px;scrollbar-width:none}
#palette::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:58px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:13px;padding:5px 6px 4px;text-align:center;cursor:pointer;font-family:inherit;color:var(--ink);position:relative;box-shadow:0 2px 8px rgba(30,20,50,.08)}
.tool .e{font-size:21px;line-height:1.15}
.tool .n{font-size:10.5px;font-weight:800}
.tool .p{font-size:9.5px;font-weight:800;color:#2f8a5a}
.tool.on{border-color:var(--accent);background:#fff2ea;transform:translateY(-2px)}
.tool.poor .p{color:var(--bad)}
.tool .dot{width:22px;height:22px;border-radius:7px;margin:2px auto 3px;border:1px solid rgba(0,0,0,.12)}
.tool.need{min-width:56px;display:flex;flex-direction:column;align-items:center}
.nring{width:34px;height:34px;margin:0 auto 1px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--c,#4cae7a) calc(var(--p,100)*1%),rgba(60,45,80,.12) 0)}
.nring span{width:27px;height:27px;border-radius:50%;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-size:16px}
.tool.need.low{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(217,96,90,.35)}}
.mhead{display:flex;gap:12px;align-items:center}
.mhead canvas{width:66px;height:66px;border-radius:50%;flex:0 0 auto}
.xbtn{border:0;background:#efe8dc;border-radius:50%;width:32px;height:32px;font-weight:900;cursor:pointer;flex:0 0 auto;align-self:flex-start;font-family:inherit}
.mtabs{display:flex;gap:3px;margin:12px -4px 4px;position:sticky;top:-16px;background:#fffdf8;padding:6px 0;z-index:2;border-bottom:1px solid var(--line)}
.mt{flex:1;border:0;background:transparent;border-radius:10px;padding:5px 0 4px;font-family:inherit;font-weight:900;font-size:15px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.mt span{font-size:10px}
.mt.on{background:var(--ink);color:#fff}
.mt i{position:absolute;top:0;right:4px;background:var(--bad);color:#fff;font-style:normal;font-size:9px;border-radius:8px;padding:0 4px}
.quote{font-size:12.5px;font-weight:700;font-style:italic;color:var(--ink);background:#f6f1e8;border-radius:12px;padding:8px 10px;margin-top:6px}
.trait{display:flex;flex-direction:column;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
.trait span{font-weight:700;color:var(--sub);font-size:11.5px}
.chaps{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chaps span{font-size:10.5px;font-weight:800;background:#f6e9e0;border-radius:8px;padding:3px 6px}
.dday{font-size:10.5px;font-weight:900;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.entry{display:flex;gap:7px;font-size:12.5px;font-weight:600;line-height:1.45;padding:4px 0}
.entry .ic{flex:0 0 auto}
.entry.d{background:#fbf7f0;border-radius:10px;padding:7px 8px;margin:3px 0}
.entry.c{background:#fdeee4;border-radius:10px;padding:7px 8px;margin:3px 0}
.crepre{display:flex;gap:6px;justify-content:center;align-items:flex-end;margin:0 -16px 6px;padding:6px 16px 8px;position:sticky;top:-16px;z-index:3;background:linear-gradient(#fffdf8 85%,rgba(255,253,248,0));}
.crepre.small canvas:first-child{width:72px;height:72px}.crepre.small canvas:last-child{width:45px;height:72px}.crepre canvas{transition:width .15s,height .15s}
.crepre canvas:first-child{width:120px;height:120px;border-radius:50%}
.crepre canvas:last-child{width:75px;height:120px}
.crow{display:flex;gap:6px;align-items:center}
.crow input{flex:1;font-family:inherit;font-weight:900;font-size:17px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.clab{font-size:11px;font-weight:900;color:var(--sub);margin:10px 0 3px;text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips .mini{margin:0}
.mini.sel{background:var(--ink);color:#fff}
.mtabs .mt{font-size:14px}.mtabs .mt span{font-size:9px}
.pers{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.pers canvas{width:40px;height:40px;border-radius:50%;flex:0 0 auto;position:static}
.pers .pi{flex:1;min-width:0;font-size:12.5px}.pers small{color:var(--sub);font-weight:700;font-size:10.5px}
.minibars{height:4px;border-radius:3px;background:#efe8dc;margin-top:3px;overflow:hidden}.minibars i{display:block;height:100%}
.pbtn{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.pbtn .mini{margin:0;font-size:11px;padding:3px 7px}
.arc{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.arc span{font-size:10.5px;font-weight:800;background:#f1ece4;border-radius:8px;padding:3px 6px;color:var(--sub)}
.arc span.ok{background:#e6f3ea;color:var(--ink)}
.outrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.outrow .oe{font-size:18px;width:24px;text-align:center}
.outrow .ot{flex:1;display:flex;flex-direction:column;min-width:0}
.outrow small{font-size:10.5px;color:var(--sub);font-weight:700}
.outrow .mini{white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
details.tracks{margin-top:6px}details.tracks summary{font-weight:900;font-size:13px;cursor:pointer;padding:6px 0}
.sep{flex:0 0 1px;background:var(--line);margin:6px 2px}
#tabs{display:flex;gap:4px;border-radius:16px;padding:4px}
#tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:8px 4px;font-family:inherit;font-weight:900;font-size:13px;color:var(--sub);cursor:pointer}
#tabs button.on{background:var(--accent);color:#fff}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:142px;max-width:calc(100vw - 112px);z-index:8;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(88vw,380px)}
.toast{background:rgba(40,34,52,.88);backdrop-filter:blur(6px);color:#fff;font-weight:700;font-size:12px;padding:7px 11px;border-radius:11px;text-align:center;animation:pop .22s ease;transition:opacity .4s}
.toast.gold{background:linear-gradient(135deg,rgba(214,150,40,.95),rgba(222,110,60,.95));font-weight:800}
.toast.fade{opacity:0}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
#menu{position:fixed;inset:0;background:rgba(30,22,40,.38);z-index:10;display:none;align-items:center;justify-content:center;padding:14px}
#menu.open{display:flex}
#menu .card{background:#fffdf8;border-radius:20px;padding:16px;width:min(380px,100%);max-height:calc(100vh - 28px);overflow-y:auto;border:1px solid var(--line);box-shadow:0 10px 40px rgba(20,10,40,.25)}
#menu h2{margin:0;font-weight:900;font-size:21px}
#menu h3{margin:16px 0 6px;font-weight:900;font-size:14px}
.sub{font-size:12.5px;font-weight:700;color:var(--sub);margin:2px 0}
.career{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.career .ttl{font-weight:900;font-size:15px}
.req{font-size:12px;font-weight:700;margin-top:4px}
.req .ok{color:var(--ok)}.req .no{color:var(--bad)}
.skill{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;margin:5px 0}
.skill .lbl{width:96px}
.skill .lv{width:34px;text-align:right}
.goal{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;padding:6px 0;border-bottom:1px dashed var(--line)}
.goal .r{margin-left:auto;font-weight:900;color:#2f8a5a;white-space:nowrap}
.goal.done{opacity:.45;text-decoration:line-through}
.room{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:800;padding:5px 0;border-bottom:1px dashed var(--line)}
.room .st{margin-left:auto;color:#d79a00}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:10px;font-family:inherit;font-weight:900;font-size:14px;margin-top:8px;cursor:pointer;background:var(--accent2);color:#fff}
.mini{border:0;border-radius:8px;padding:4px 7px;font-family:inherit;font-weight:800;font-size:11px;background:#efe8dc;color:var(--ink);cursor:pointer;margin-left:4px}
.btn.red{background:var(--bad)}.btn.grey{background:#efe8dc;color:var(--ink)}
.swatches{display:flex;gap:8px;margin:4px 0 4px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
#status{cursor:pointer}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .wd{font-size:10px;font-weight:900;color:var(--sub);text-align:center}
.cd{border-radius:10px;padding:4px 0 3px;text-align:center;font-size:11.5px;font-weight:900;background:#f6f1e8;min-height:42px;cursor:pointer;line-height:1.25;position:relative}
.cd .ic{font-size:13px}
.cd.work{background:#fff}.cd.weekend{background:#e9f4ea}.cd.fest{background:#fde9d6}.cd.vac{background:#dff0fb}
.cd.past{opacity:.4}.cd.today{outline:2.5px solid var(--accent);outline-offset:-1px}.cd.blank{background:transparent;cursor:default}
.cd .rent{position:absolute;top:1px;right:3px;font-size:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;font-weight:800;color:var(--sub);margin-top:8px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;padding:5px 0;border-bottom:1px dashed var(--line)}
#hint{font-size:10.5px;font-weight:800;color:var(--sub);text-align:center;padding:0 6px 5px;min-height:0;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#hint:empty{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div class="pill glass" id="status"><span id="money">§ 0</span><span id="clock">Día 1 · 08:00</span></div>
  <div class="spacer"></div>
  <div class="pill speed glass" id="speed">
    <button data-s="0">❚❚</button><button data-s="1" class="on">1×</button><button data-s="3">3×</button><button data-s="10">10×</button>
  </div>
</div>

<button id="placebtn" class="glass"></button>
<div id="needs" class="glass">
  <canvas id="hudpor" width="96" height="96"></canvas>
  <div class="hcol"><div class="head"><span id="hname">Ana</span><span class="mood" id="mood">🙂</span><span class="act" id="act">Pensando…</span></div><div id="line"></div></div>
</div>

<div id="side">
  <div class="pill glass" id="menubtn" title="Ana, casa y objetivos">📋<span class="badge" id="badge">!</span></div>
  <div class="pill" id="zin">➕</div>
  <div class="pill" id="zout">➖</div>
  <div class="pill glass" id="rotbtn" title="Girar cámara">🔄</div>
  <div class="pill glass" id="wallsbtn" title="Paredes">✂️</div>
  <div class="pill glass" id="center" title="Centrar en Ana">🎯</div>
</div>

<div id="toasts"></div>

<div id="bottom">
  <div id="cats"></div>
  <div id="palette"></div>
  <div id="hint"></div>
  <div id="tabs" class="glass">
    <button data-m="live" class="on">🏡 Vivir</button>
    <button data-m="build">🧱 Construir</button>
    <button data-m="buy">🛋️ Comprar</button>
  </div>
</div>

<div id="menu"><div class="card" id="menucard"></div></div>

<script>
(() => {
const N = 20, TW = 64, TH = 32, WALL_H = 54, LOW_H = 10;
const NEEDS = [
  ['hambre','🍔','Hambre',0.075],
  ['energia','⚡','Energía',0.055],
  ['higiene','🧼','Higiene',0.045],
  ['vejiga','🚽','Vejiga',0.09],
  ['diversion','🎉','Diversión',0.06],
  ['social','💬','Social',0.04],
];
const DECAY = Object.fromEntries(NEEDS.map(n=>[n[0],n[3]]));
const SKILLS = [['cocina','🍳','Cocina'],['logica','🧠','Lógica'],['carisma','🗣️','Carisma'],['musica','🎸','Música'],['carp','🪚','Carpintería'],['elec','⚡','Electrónica'],['font','🚰','Fontanería'],['alba','🧱','Albañilería'],['jard','🌱','Jardinería']];
let CAREER = [
  {t:'Becaria',pay:120,req:{}},
  {t:'Ayudante',pay:170,req:{shifts:3}},
  {t:'Técnica',pay:230,req:{shifts:6,logica:2}},
  {t:'Especialista',pay:310,req:{shifts:10,logica:3,carisma:2}},
  {t:'Coordinadora',pay:400,req:{shifts:15,logica:5,carisma:4}},
  {t:'Directora',pay:520,req:{shifts:22,logica:7,carisma:6}},
];

// ---------- dificultad ----------
const DIFF={
  facil:{n:'Fácil',e:'🌱',pay:1,price:1,rent:1,food:0,money:2000,goal:1,xp:1,shifts:1,skillAdd:0,desc:'Sueldos generosos y todo barato: la casa crece en pocos días.'},
  normal:{n:'Normal',e:'🙂',pay:0.9,price:2,rent:0.8,food:2,money:1000,goal:0.6,xp:0.7,shifts:4,skillAdd:0,desc:'Hay que ahorrar unas semanas para cada mejora; ascender lleva varias semanas.'},

  x.fillStyle=mul(s,.9);x.beginPath();x.moveTo(cx-nw-5.4,y0-.6);x.quadraticCurveTo(cx,y0+(c.cuello==='pico'?9:4.4),cx+nw+5.4,y0-.6);x.quadraticCurveTo(cx,y0-2,cx-nw-5.4,y0-.6);x.fill();

// ---------- orejas ----------
function ears(x,c,g){const s=c.skin,f=g.f;const sz=4.6+(f.orejas-.5)*1.6;const y=g.eyeY+3.5;

// ---------- piel ----------
function skin(x,c,g){const s=c.skin,f=g.f;
  facePath(x,g);x.fillStyle=s;x.fill();
  x.save();facePath(x,g);x.clip();
  // luz principal arriba-izquierda

  let l=x.createLinearGradient(g.cx+g.fw*.3,0,g.cx+g.fw,0);l.addColorStop(0,mul(s,.8,0));l.addColorStop(1,mul(s,.72,.55));x.fillStyle=l;x.fillRect(0,0,100,100);
  // pómulos: sombra bajo el pómulo

    // brillo en pómulo
    const hh=x.createRadialGradient(g.cx+sd*g.fw*.55,g.eyeY+5.5,.5,g.cx+sd*g.fw*.55,g.eyeY+5.5,5);hh.addColorStop(0,mul(s,1.15,.35*pm*(sd<0?1:.5)));hh.addColorStop(1,mul(s,1.15,0));x.fillStyle=hh;x.fillRect(0,0,100,100);
    // rubor
    const bl=x.createRadialGradient(g.cx+sd*g.fw*.55,g.eyeY+9,.5,g.cx+sd*g.fw*.55,g.eyeY+9,6);bl.addColorStop(0,`rgba(214,96,86,${c.makeup?.22:.13})`);bl.addColorStop(1,'rgba(214,96,86,0)');x.fillStyle=bl;x.fillRect(0,0,100,100);
    // cuencas de los ojos
    const ey=x.createRadialGradient(g.cx+sd*g.eyeDX,g.eyeY-1,1,g.cx+sd*g.eyeDX,g.eyeY-1,7);ey.addColorStop(0,mul(s,.72,.28));ey.addColorStop(1,mul(s,.72,0));x.fillStyle=ey;x.fillRect(0,0,100,100);}
  // sombra de mandíbula y bajo barbilla
  let jg=x.createLinearGradient(0,g.chinY-9,0,g.chinY);jg.addColorStop(0,mul(s,.8,0));jg.addColorStop(1,mul(s,.7,.35));x.fillStyle=jg;x.fillRect(0,0,100,100);
  if(g.est==='marcada'){const br=x.createLinearGradient(0,g.eyeY-7,0,g.eyeY-2);br.addColorStop(0,mul(s,1.1,.25));br.addColorStop(1,mul(s,.7,.3));x.fillStyle=br;x.fillRect(g.cx-g.fw,g.eyeY-7,g.fw*2,5);
    for(const sd of [-1,1]){const jg2=x.createRadialGradient(g.cx+sd*g.jw*.95,g.chinY-7,1,g.cx+sd*g.jw*.95,g.chinY-7,6);jg2.addColorStop(0,mul(s,.68,.4));jg2.addColorStop(1,mul(s,.68,0));x.fillStyle=jg2;x.fillRect(0,0,100,100);}
    E(x,g.cx,g.chinY-2.5,g.cw*.8,1.6,mul(s,1.12,.25));}
  else{for(const sd of [-1,1])E(x,g.cx+sd*g.fw*.5,g.eyeY+7,5,4,mul(s,1.1,.12));}
  // frente brillo
  E(x,g.cx-3,g.top+8,7,3.2,mul(s,1.15,.25),-.15);
  // edad
  if(c.age>=38){const a=Math.min(1,(c.age-35)/30);x.strokeStyle=mul(s,.62,.25+.35*a);x.lineWidth=.45;x.beginPath();
    // patas de gallo
    for(const sd of [-1,1])for(let i=0;i<3;i++){const ox=g.cx+sd*(g.eyeDX+5.5),oy=g.eyeY-.6+i*1.4;x.moveTo(ox,oy);x.lineTo(ox+sd*2.2,oy-1+i*.9);}
    // frente
    if(c.age>=48)for(let i=0;i<2;i++){x.moveTo(g.cx-8,g.top+9+i*2.6);x.quadraticCurveTo(g.cx,g.top+8+i*2.6,g.cx+8,g.top+9+i*2.6);}
    x.stroke();
    // surcos nasogenianos
    x.strokeStyle=mul(s,.6,.2+.35*a);x.lineWidth=.7;x.beginPath();for(const sd of [-1,1]){x.moveTo(g.cx+sd*4.2,g.noseY-.6);x.quadraticCurveTo(g.cx+sd*7.4,g.mouthY-1,g.cx+sd*6.6,g.mouthY+3.4);}x.stroke();
    // ojeras / bolsas
    for(const sd of [-1,1]){x.strokeStyle=mul(s,.65,.3*a);x.lineWidth=.5;x.beginPath();x.moveTo(g.cx+sd*(g.eyeDX-3.5),g.eyeY+3.2);x.quadraticCurveTo(g.cx+sd*g.eyeDX,g.eyeY+4.6,g.cx+sd*(g.eyeDX+3.6),g.eyeY+3);x.stroke();}

    x.beginPath();x.moveTo(g.cx-g.fw*.95,g.eyeY+6);x.quadraticCurveTo(g.cx-g.fw*.6,g.mouthY-3,g.cx-4,g.noseY+2);x.lineTo(g.cx+4,g.noseY+2);x.quadraticCurveTo(g.cx+g.fw*.6,g.mouthY-3,g.cx+g.fw*.95,g.eyeY+6);x.lineTo(g.cx+g.fw,100);x.lineTo(g.cx-g.fw,100);x.fill();
    const R=rng(7);x.fillStyle=mul(c.hair,.8,.5);for(let i=0;i<260;i++){const px=g.cx+(R()-.5)*g.fw*2,py=g.noseY+2+R()*(g.chinY-g.noseY);x.fillRect(px,py,.25,.25);}x.globalAlpha=1;}
  x.restore();

}

// ---------- ojos ----------
const OJOS={almendra:{h:3.1,tilt:.5,lid:.55},redondos:{h:4,tilt:0,lid:.35},caidos:{h:3.2,tilt:-1.1,lid:.75},rasgados:{h:2.4,tilt:1.4,lid:.85},encapotados:{h:2.8,tilt:.2,lid:1}};
function eyes(x,c,g){const f=g.f,T=OJOS[f.ojos]||OJOS.almendra;const w=4.4+(f.tamOjos-.5)*1.4,h=T.h*(.85+f.tamOjos*.3);
  const exp=f.expresion;const s=c.skin;
  for(const sd of [-1,1]){const ex=g.cx+sd*g.eyeDX,ey=g.eyeY+(exp==='cansada'?.4:0);
    const inX=ex-sd*w,outX=ex+sd*w,inY=ey+.2,outY=ey-T.tilt*.6;
    const hh=h*(exp==='sonrisa'?.8:exp==='cansada'?.75:1);
    const top=()=>{x.moveTo(inX,inY);x.bezierCurveTo(ex-sd*w*.55,ey-hh*1.05,ex+sd*w*.35,ey-hh*1.1,outX,outY);};
    const bot=()=>{x.bezierCurveTo(ex+sd*w*.45,ey+hh*.55,ex-sd*w*.4,ey+hh*.6,inX,inY);};
    // párpado superior (sombra/maquillaje)
    if(c.makeup){const mg=x.createRadialGradient(ex+sd*1,ey-2.5,.5,ex+sd*1,ey-2.5,6);mg.addColorStop(0,c.makeupCol||'rgba(140,90,120,.45)');mg.addColorStop(1,'rgba(140,90,120,0)');x.fillStyle=mg;x.fillRect(ex-8,ey-9,16,12);}
    // blanco del ojo
    x.save();x.beginPath();top();bot();x.closePath();
    const wg=x.createRadialGradient(ex,ey,.5,ex,ey,w*1.1);wg.addColorStop(0,'#fbf8f3');wg.addColorStop(.7,'#ece4dc');wg.addColorStop(1,'#cdb9ad');x.fillStyle=wg;x.fill();x.clip();
    // iris
    const ix=ex+sd*.15,iy=ey+.15,ir=2.25+(f.tamOjos-.5)*.4;
    const ig=x.createRadialGradient(ix,iy,.3,ix,iy,ir);ig.addColorStop(0,mul(c.eyes,1.6));ig.addColorStop(.55,c.eyes);ig.addColorStop(.9,mul(c.eyes,.55));ig.addColorStop(1,mul(c.eyes,.3));
    E(x,ix,iy,ir,ir,ig);
    x.strokeStyle=mul(c.eyes,1.9,.35);x.lineWidth=.18;x.beginPath();for(let a=0;a<6.28;a+=.45){x.moveTo(ix+Math.cos(a)*.9,iy+Math.sin(a)*.9);x.lineTo(ix+Math.cos(a)*ir*.85,iy+Math.sin(a)*ir*.85);}x.stroke();
    E(x,ix,iy,ir*.42,ir*.42,'#0d0909');
    // sombra del párpado sobre el ojo
    const sg=x.createLinearGradient(0,ey-hh,0,ey+.5);sg.addColorStop(0,'rgba(60,30,25,.5)');sg.addColorStop(1,'rgba(60,30,25,0)');x.fillStyle=sg;x.fillRect(ex-w-1,ey-hh-1,w*2+2,hh+1.5);
    E(x,ix-ir*.35,iy-ir*.38,.62,.55,'rgba(255,255,255,.95)');E(x,ix+ir*.4,iy+ir*.35,.28,.28,'rgba(255,255,255,.6)');
    x.restore();
    // línea superior (pestañas)
    x.strokeStyle='#1b1212';x.lineCap='round';x.lineWidth=g.fem||c.makeup?.95:.7;x.beginPath();top();x.stroke();
    if(c.makeup){x.lineWidth=.8;x.beginPath();x.moveTo(outX,outY);x.lineTo(outX+sd*1.6,outY-1.1);x.stroke();}
    if(g.fem){x.lineWidth=.22;x.strokeStyle='rgba(27,18,18,.75)';x.beginPath();for(let i=0;i<5;i++){const t=.55+i*.1;const px=inX+(outX-inX)*t,py=inY+(outY-inY)*t-hh*Math.sin(Math.PI*t)*1.0;x.moveTo(px,py);x.lineTo(px+sd*(.3+t*.6),py-.6-t*.3);}x.stroke();}
    // línea inferior
    x.strokeStyle=mul(s,.55,.55);x.lineWidth=.35;x.beginPath();x.moveTo(outX,outY);bot();x.stroke();
    // lagrimal
    E(x,inX+sd*.5,inY+.1,.55,.4,'rgba(210,130,125,.8)');
    // pliegue del párpado
    const lid=T.lid;x.strokeStyle=mul(s,.55,.5);x.lineWidth=.42;x.beginPath();x.moveTo(inX+sd*.6,inY-1.2-lid*.3);x.bezierCurveTo(ex-sd*w*.4,ey-hh-1.6+lid*.8,ex+sd*w*.4,ey-hh-1.7+lid*.8,outX-sd*.4,outY-1.4+lid*.4);x.stroke();
    if(f.ojos==='encapotados'){x.fillStyle=mul(s,.95);x.beginPath();x.moveTo(ex-sd*w*.2,ey-hh-.6);x.quadraticCurveTo(ex+sd*w*.6,ey-hh-.4,outX+sd*.6,outY+.1);x.quadraticCurveTo(ex+sd*w*.5,ey-hh+.6,ex-sd*w*.2,ey-hh-.6);x.fill();}
    if(exp==='sonrisa'){x.strokeStyle=mul(s,.6,.5);x.lineWidth=.4;x.beginPath();x.moveTo(ex-sd*w*.6,ey+hh*.9);x.quadraticCurveTo(ex,ey+hh*1.4,ex+sd*w*.8,ey+hh*.7);x.stroke();}
  }}

// ---------- cejas ----------
const CEJAS={natural:[0,1.4,.2],arqueada:[.4,2.6,.6],recta:[0,.6,-.1],angulosa:[.2,2.2,1.4],fruncida:[-1.2,.9,.0]};
function brows(x,c,g){const f=g.f,B=CEJAS[f.cejas]||CEJAS.natural;const th=(.5+f.grosorCejas)*(g.fem?.8:1.15);
  let col=c.age>60?mix(c.hair,'#bbbbbb',.4):c.hair;if(c.browCol)col=c.browCol;const R=rng(hash(c.hair+f.cejas));
  const expY=f.expresion==='sorpresa'?-1.6:f.expresion==='enfado'?.9:0;
  for(const sd of [-1,1]){const by=g.eyeY-5.6+expY;const x0=g.cx+sd*2.6,x1=g.cx+sd*(g.eyeDX+5.8);
    const pt=t=>{const px=x0+(x1-x0)*t;const arch=Math.sin(Math.min(1,t/(.65+B[2]*.1))*Math.PI*.5)*(t<.7?1:1-(t-.7)*1.6)*B[1];const fr=(f.expresion==='enfado'?(1-t)*1.6:0);return [px,by-arch+B[0]*(1-t)+fr+(t>.7?(t-.7)*1.8:0)];};
    // base suave
    x.strokeStyle=mul(col,1,.35);x.lineWidth=th*1.7;x.lineCap='round';x.beginPath();for(let t=0;t<=1.001;t+=.05){const p=pt(t);t?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]);}x.stroke();
    // pelos
    x.strokeStyle=mul(col,.85,.85);x.lineWidth=.22;x.beginPath();
    for(let i=0;i<70;i++){const t=R();const p=pt(t);const thick=th*(1-t*.55);const oy=(R()-.5)*thick*1.6;const ang=(t<.25?-1.2:-.35)*sd;
      const L=.9+R()*.9;x.moveTo(p[0],p[1]+oy);x.lineTo(p[0]+Math.cos(ang)*L*sd*(t<.25?.4:1),p[1]+oy+Math.sin(ang)*L*.5*sd*sd*(t<.25?1.4:.6)*-1);}
    x.stroke();}}

// ---------- nariz ----------
const NARIZ={recta:{w:3.4,b:0,tip:1.6},ancha:{w:4.6,b:0,tip:2},aguilena:{w:3.4,b:1.2,tip:1.4},respingona:{w:3.1,b:-.6,tip:1.5},pequena:{w:2.7,b:0,tip:1.2},chata:{w:4.4,b:-.3,tip:2.3}};
function nose(x,c,g){const f=g.f,N=NARIZ[f.nariz]||NARIZ.recta;const s=c.skin;const sc=.85+f.tamNariz*.35;const w=N.w*sc,ny=g.noseY,cx=g.cx;const ty=ny-.4;
  // sombra lateral del tabique (lado derecho)

  x.beginPath();x.moveTo(cx+.8,g.eyeY+1);x.quadraticCurveTo(cx+1.6+N.b,ny-5,cx+w*.65,ny-1.4);x.lineTo(cx+w*.25,ny-1);x.quadraticCurveTo(cx+.6+N.b*.6,ny-5,cx+.2,g.eyeY+1);x.fill();
  if(N.b>0){x.strokeStyle=mul(s,.65,.4);x.lineWidth=.45;x.beginPath();x.moveTo(cx+.4,g.eyeY+3);x.quadraticCurveTo(cx+.9+N.b,ny-5,cx+.6,ny-2);x.stroke();}
  // sombra bajo la nariz
  E(x,cx,ny+1.2,w*.75,1.1,mul(s,.62,.35));
  // aletas
  x.strokeStyle=mul(s,.55,.65);x.lineWidth=.55;x.lineCap='round';
  for(const sd of [-1,1]){x.beginPath();x.moveTo(cx+sd*w*.42,ny-2.2);x.bezierCurveTo(cx+sd*w*1.05,ny-2.1,cx+sd*w*1.05,ny+.4,cx+sd*w*.55,ny+.6);x.stroke();}
  // orificios
  for(const sd of [-1,1])E(x,cx+sd*w*.38,ny+.35,w*.2,.55,mul(s,.35,.75),sd*.35);
  // punta
  const tg=x.createRadialGradient(cx-.4,ty-N.b*.2-1,.2,cx,ty-.6,N.tip*1.4);tg.addColorStop(0,mul(s,1.2,.6));tg.addColorStop(1,mul(s,1.1,0));x.fillStyle=tg;x.fillRect(cx-4,ty-4,8,6);

  if(N.b<0){x.strokeStyle=mul(s,.6,.35);x.lineWidth=.4;x.beginPath();x.moveTo(cx-w*.3,ny+.1);x.quadraticCurveTo(cx,ny-.5,cx+w*.3,ny+.1);x.stroke();}
}

// ---------- boca ----------
const BOCA={fina:{w:5.2,u:.9,l:1.3},media:{w:5.6,u:1.3,l:1.9},carnosa:{w:6,u:1.9,l:2.7},ancha:{w:7,u:1.3,l:2},pequena:{w:4.4,u:1.2,l:1.7}};
function mouth(x,c,g){const f=g.f,B=BOCA[f.boca]||BOCA.media;const s=c.skin;const k=.8+f.labios*.45;const w=B.w,u=B.u*k,l=B.l*k,cx=g.cx,my=g.mouthY;
  const sm=f.expresion==='sonrisa'?1.3:f.expresion==='enfado'||f.expresion==='triste'?-.8:f.expresion==='sorpresa'?0:.15;
  const lipBase=c.makeup?(c.lipCol||'#b2424c'):mix(s,'#b0574f',g.fem?.5:.33);
  // surco nasolabial (filtrum)
  x.fillStyle=mul(s,.75,.25);x.beginPath();x.moveTo(cx-1,g.noseY+1.6);x.lineTo(cx-1.2,my-u);x.lineTo(cx+1.2,my-u);x.lineTo(cx+1,g.noseY+1.6);x.fill();
  // labio superior
  const L=cx-w,R=cx+w,cy=my-sm;

function lowestNeed(){let k='hambre',v=999;for(const [n] of NEEDS)if(S.needs[n]<v){v=S.needs[n];k=n;}return [k,v];}

function bfs(start,isTarget){
  const [sx,sy]=start; if(!inb(sx,sy))return null;
  if(isTarget(sx,sy))return [];

    const c=q[qi++],cx=c%N,cy=c/N|0;

      const nx=cx+dx,ny=cy+dy;if(!walkable(nx,ny))continue;const ni=idx(nx,ny);if(seen[ni])continue;seen[ni]=1;prev[ni]=c;
      if(isTarget(nx,ny)){const path=[];let k=ni;while(k!==idx(sx,sy)){path.unshift([k%N,k/N|0]);k=prev[k];}return path;}
      q.push(ni);

function bestObjFor(k){

  const H=Hm(),price=housePrice(),down=Math.round(price*H.down),closing=Math.round(price*H.closing),P=price-down,n=H.years*52,rr=curRate()/52;
  const pay=Math.round(P*rr/(1-Math.pow(1+rr,-n)));const inc=salary()*5;
  const why=[];if(S.jobless)why.push('no tiene trabajo');if((S.rep??70)<40)why.push('su reputación laboral es baja');if(pay>inc*0.4)why.push('la cuota supera el 40 % de su sueldo');if(S.money<down+closing)why.push(`le faltan ${fmt(down+closing-S.money)} para la entrada y los gastos`);
  return {price,down,closing,P,n,pay,rate:curRate(),ok:!why.length,why};
}
function buyHouse(mode){
  const o=mortgageOffer();
  if(mode==='cash'){if(S.money<o.price+o.closing){toast(`Hacen falta ${fmt(o.price+o.closing)} para comprarla al contado`);sfx('bad');return false;}S.money-=o.price+o.closing;S.owned=true;S.mort=null;}
  else{if(!o.ok){toast('El banco no concede la hipoteca: '+o.why.join(', '));sfx('bad');return false;}S.money-=o.down+o.closing;S.owned=true;S.mort={left:o.P,pay:o.pay,rate:o.rate,weeks:o.n};}
  S.housePaid=o.price;bumpMoney();sfx('level');setTimeout(()=>chapter('casa','Las llaves',`${CH().name} ha firmado ${mode==='cash'?'y pagado al contado':'la hipoteca'}. La casa ya es suya${mode==='cash'?'':'… y un poco del banco'}. Lo primero que hizo fue quedarse un rato en silencio, mirando las paredes.`),1200);confetti(S.sim.x,S.sim.y,60);toast(`🔑 ¡Ana es propietaria! Adiós al alquiler${S.mort?` · hipoteca de ${fmt(S.mort.left)} a ${(S.mort.rate*100).toFixed(1)} %, ${fmt(S.mort.pay)}/semana`:''}`,true);return true;
}
function payMortgage(){
  const m=S.mort;if(!m)return;const rr=m.rate/52;const int=m.left*rr;const pay=Math.min(m.pay,Math.round(m.left+int));
  m.left=Math.max(0,m.left+int-pay);m.weeks--;S.money-=pay;bumpMoney();
  if(m.left<1){S.mort=null;toast('🏦 ¡Hipoteca pagada! La casa es 100 % de Ana 🎉',true);confetti(S.sim.x,S.sim.y,60);}
  else toast(`🏦 Cuota de la hipoteca: ${fmt(pay)} (quedan ${fmt(m.left)})`,true);
}
function amortize(amount){const m=S.mort;if(!m)return;const a=Math.min(amount,m.left,S.money);if(a<=0)return;S.money-=a;m.left-=a;if(m.left<1){S.mort=null;toast('🏦 ¡Hipoteca liquidada!',true);}else{const rr=m.rate/52;m.pay=Math.round(m.left*rr/(1-Math.pow(1+rr,-Math.max(1,m.weeks))));toast(`🏦 Amortizado ${fmt(a)} · nueva cuota ${fmt(m.pay)}/semana`);}bumpMoney();}

function utilTick(gm){
  const u=S.util=S.util||{luz:0,agua:0,gas:0};const s=S.sim,night=nightFactor()>0.3;
  if(has('nevera'))u.luz+=0.0006*gm;

    if(t==='tele'||t==='compu')u.luz+=0.01*gm;if(t==='fogon'){u.gas+=0.04*gm;u.luz+=0.004*gm;}
    if(t==='ducha'){u.agua+=0.035*gm;u.gas+=0.025*gm;}if(t==='vater')u.agua+=0.015*gm;if(t==='banco')u.luz+=0.004*gm;if(t==='planta'||t==='flores')u.agua+=0.002*gm;}
}

function goWork(silent){
  const s=S.sim,nd=S.needs;
  if(s.work>0)return toast('Ana ya está en el trabajo');
  if(!silent&&s.leaving)return toast('Ana ya va de camino 🚶‍♀️');
  const dt=dayType(S.day),h=S.t/60;
  if(S.jobless){sfx('bad');return toast('Ana no tiene trabajo ahora mismo: está buscando');}
  if(S.sick>0){sfx('bad');return toast('Ana está de baja, enferma 🤒');}
  if(dt!=='work'){sfx('bad');return toast(`Hoy no se trabaja: ${DAYNAME[dt].toLowerCase()} ${DAYICON[dt]}`);}
  if(S.lastWorkDay===S.day){return toast('Ana ya ha ido a trabajar hoy');}
  if(noWorkToday()){return toast(S.jail>0?'Ana está detenida':'Hoy no se trabaja: hay huelga ✊');}
  if(h<SHIFT.leave-1){return toast(`Es muy pronto: el turno es de ${SHIFT.start}:00 a ${SHIFT.end}:00`);}
  if(h>=SHIFT.end-1){sfx('bad');return toast('Ya es tarde para ir: el turno casi ha terminado');}
  if(nd.energia<6){sfx('bad');return toast('Ana tiene demasiado sueño para trabajar');}
  s.use=null;s.target=null;
  const edge=(x,y)=>x===0||y===0||x===N-1||y===N-1;
  const p=bfs(simCell(),edge);
  if(p&&p.length){s.path=p;s.leaving=true;if(!silent)toast('Ana sale hacia el trabajo 🚶‍♀️');}
  else depart();
}

function roomPurpose(r){
  const z={};for(const c of r.cells){const v=S.zone&&S.zone[c];if(v)z[v]=(z[v]||0)+1;}
  let best=null,bn=0;for(const k in z)if(z[k]>bn){bn=z[k];best=k;}
  if(best&&bn>=r.cells.length*0.5)return best;

    if(PRIVATE.has(k)){let doors=0;const seen=new Set();for(const c of r.cells){const x=c%N,y=c/N|0;for(const [a,b] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){if(!inb(a,b))continue;const j=idx(a,b);if(S.wall[j]===2&&!seen.has(j)){seen.add(j);doors++;}}}if(doors>=2)return 'loft';}

function clusterScore(t,x,y){
  const g=GROUP[t];if(!g)return 0;let sc=0;

function chairsAround(i){const x=i%N,y=i/N|0;let n=0;for(const [a,b] of [[x,y+1],[x+1,y],[x-1,y],[x,y-1]])if(inb(a,b)&&S.obj[idx(a,b)]&&S.obj[idx(a,b)].t==='silla')n++;return n;}

}
// ---------- circulación: cómo se va de un cuarto a otro ----------
const PRIVATE=new Set(['dormitorio','bano']);
const NEAR={cocina:['salon','loft','pasillo'],salon:['cocina','loft','pasillo','estudio'],dormitorio:['bano','pasillo','salon','loft'],bano:['dormitorio','pasillo','salon','loft'],estudio:['salon','pasillo','dormitorio','loft'],taller:['salon','pasillo','loft']};
function roomGraph(){
  computeRooms();const adj=new Map();const add=(a,b)=>{if(a===b)return;if(!adj.has(a))adj.set(a,new Set());if(!adj.has(b))adj.set(b,new Set());adj.get(a).add(b);adj.get(b).add(a);};
  const side=(x,y)=>{if(!inb(x,y))return -1;const j=idx(x,y);if(S.wall[j]&&S.wall[j]!==2&&S.wall[j]!==4)return null;return roomId[j]>=0?roomId[j]:-1;};
  for(let i=0;i<N*N;i++){if(S.wall[i]!==2)continue;const x=i%N,y=i/N|0;
    for(const [[ax,ay],[bx,by]] of [[[x-1,y],[x+1,y]],[[x,y-1],[x,y+1]]]){const a=side(ax,ay),b=side(bx,by);if(a!=null&&b!=null)add(a,b);}}
  return adj;
}
// se recorre la casa desde la calle; los cuartos privados se pueden visitar pero no atravesar
const OUTDOOR_OK=new Set(['salon','pasillo','taller','loft','estudio','libre']);
// ¿hay una entrada principal en una zona que la admite? entonces las puertas a la calle de cocina, baño o dormitorio no cuentan
function hasMainEntrance(adj){for(const n of (adj.get(-1)||[]))if(n>=0&&rooms[n]&&OUTDOOR_OK.has(rooms[n].purpose))return true;return false;}
function reachableRooms(){const adj=roomGraph();const seen=new Set([-1]);const q=[-1];const strict=hasMainEntrance(adj);
  while(q.length){const c=q.shift();for(const n of (adj.get(c)||[])){if(seen.has(n))continue;if(c===-1&&strict&&n>=0&&rooms[n]&&!OUTDOOR_OK.has(rooms[n].purpose))continue;seen.add(n);if(n>=0&&rooms[n]&&PRIVATE.has(rooms[n].purpose))continue;q.push(n);}}
  return seen;}
function badRooms(){const reach=reachableRooms();return rooms.filter(r=>r.purpose!=='libre'&&!reach.has(r.id));}
// si una zona común solo se alcanza cruzando un dormitorio o un baño, abre una puerta nueva hacia otra zona común o a la calle
function planCirculation(){
  computeRooms();const bad=badRooms();if(!bad.length)return null;
  const reach=reachableRooms();
  for(const R of bad){
    let best=null,bs=-1e9;
    for(const c of R.cells){const x=c%N,y=c/N|0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const wx=x+dx,wy=y+dy;if(!inb(wx,wy))continue;const wi=idx(wx,wy);if(S.wall[wi]!==1)continue;
        const ox=wx+dx,oy=wy+dy;if(!inb(ox,oy))continue;const oi=idx(ox,oy);if(S.wall[oi]&&S.wall[oi]!==2)continue;
        const along=dx!==0?[[wx,wy-1],[wx,wy+1]]:[[wx-1,wy],[wx+1,wy]];if(!along.every(([a,b])=>inb(a,b)&&S.wall[idx(a,b)]))continue;
        if(S.obj[oi]||S.obj[c])continue;
        const orr=roomId[oi];let sc=-1e9;
        if(orr<0&&walkable(ox,oy)&&OUTDOOR_OK.has(R.purpose))sc=2;
        else if(orr>=0&&reach.has(orr)&&!PRIVATE.has(rooms[orr].purpose))sc=6+((NEAR[R.purpose]||[]).includes(rooms[orr].purpose)?4:0);
        if(sc>bs){bs=sc;best=wi;}}}
    if(best==null){const sw=planSwap(R);if(sw)return sw;}
    if(best!=null)return {key:'circ-'+R.id,name:'Puerta nueva para '+R.name.toLowerCase(),emoji:'🚪',why:'para no tener que cruzar un cuarto privado',kind:'build',steps:[{k:'door',i:best}]};
  }
  return null;
}
// intercambia el uso de dos cuartos (p. ej. la cocina que solo se alcanza cruzando el dormitorio pasa a ser el dormitorio) y lleva los muebles
function planSwap(R){
  if(S.lastSwapDay&&S.day-S.lastSwapDay<7)return null;
  const adj=roomGraph(),reach=reachableRooms();
  for(const p of (adj.get(R.id)||[])){
    if(p<0)continue;const P=rooms[p];if(!P||!PRIVATE.has(P.purpose)||!reach.has(p))continue;
    const ok=[...(adj.get(p)||[])].some(q=>q!==R.id&&(q===-1||(rooms[q]&&!PRIVATE.has(rooms[q].purpose)&&reach.has(q))));if(!ok)continue;
    const belongs=(t,z)=>ZONE_OF[t]===z||(z==='cocina'&&(t==='mesa'||t==='silla'))||(z==='bano'&&t==='espejo');
    const steps=[{k:'rezone',i:R.cells[0],a:R.cells.slice(),az:P.purpose,b:P.cells.slice(),bz:R.purpose}];
    for(const c of R.cells){const o=S.obj[c];if(o&&belongs(o.t,R.purpose))steps.push({k:'move',v:o.t,from:c,zone:R.purpose,i:null});}
    for(const c of P.cells){const o=S.obj[c];if(o&&belongs(o.t,P.purpose))steps.push({k:'move',v:o.t,from:c,zone:P.purpose,i:null});}
    // puertas a la calle que se queden en el cuarto que pasa a ser privado: se tapian
    for(const c of R.cells){const x=c%N,y=c/N|0;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const wx=x+dx,wy=y+dy;if(!inb(wx,wy))continue;const wi=idx(wx,wy);if(S.wall[wi]!==2)continue;const ox=wx+dx,oy=wy+dy;if(inb(ox,oy)&&roomId[idx(ox,oy)]<0&&!S.wall[idx(ox,oy)])steps.push({k:'undoor',i:wi});}}
    return {key:'swap-'+R.id,name:`Cambiar ${R.name.toLowerCase()} por ${P.name.toLowerCase()}`,emoji:'🔄',why:'para no cruzar un cuarto privado ni salir a la calle',kind:'build',steps};
  }
  return null;
}

const bizCapital=()=>Math.round(900*PM());
function entryMissing(k){
  const T0=TRACKS[k],m=[];if(k===S.track&&!S.jobless)return ['ya trabajas aquí'];
  for(const [sk,,nm] of SKILLS){const r=T0.levels[0].req[sk];if(r&&lvl(sk)<r)m.push(`${nm} ${r}`);}

  if(T0.self&&S.money<bizCapital())m.push(`${fmt(bizCapital())} de capital`);
  if(T0.coop&&!(S.pol&&S.pol.coopOK))m.push('montar o encontrar una cooperativa (sindicato, militancia o huelga ganada)');

function seekTick(){
  if(!S.seek)return;const k=S.seek;if(entryMissing(k).length&&!(k===S.track&&S.jobless)){S.seek=null;return;}
  if(TRACKS[k].self||TRACKS[k].opos||k==='coop'){startTrack(k);return;}
  if(dayType(S.day)==='weekend'&&!S.jobless)return;
  let p=SEEK_BASE[k]*(Dm().soul?0.5:Dm().money<500?0.7:1.3)*(1-W_().crisis/220)*(S.record?0.55:1)*(1+0.03*lvl('carisma'))*(k==='tech'?1+0.05*(lvl('logica')-4):1)*(S.netBoost>S.day?1.4:1);

function autoSeek(){
  if(!S.autoHome||S.seek)return;
  const ok=TRK_ORDER.filter(k=>!entryMissing(k).length);if(!ok.length)return;
  const pref=(IDEOS[S.ideo]||IDEOS.apolitica).tracks||[];
  const score=k=>{const T0=TRACKS[k];let v=T0.levels[0].pay*(T0.gig?0.75:1)-(T0.tox[0]+T0.tox[1])*40+(pref.includes(k)?40:0)+(T0.lay===0&&Dm().soul?30:0);if(T0.self)v+=S.money>bizCapital()*2?40:-120;if(k==='reparto')v+=S.jobless&&S.money<0?60:-60;return v+Math.random()*20;};
  if(S.jobless){const best=ok.sort((a,b)=>score(b)-score(a))[0];S.seek=best;toast(`🔎 ${CH().name} busca trabajo de ${TRACKS[best].n.toLowerCase()}`);return;}
  // con trabajo: cambia si el suyo es claramente peor
  if(S.pol.coopOK&&S.track!=='coop'&&pref.includes('coop')&&Math.random()<.35){S.seek='coop';seekTick();return;}
  if(S.strike||S.career>=2||(S.union&&S.union.member&&office().org>30&&isI('marxista','anarquista','socialdemocrata')))return; // se queda a pelear o ya ha prosperado
  const cur=TRACKS[S.track],curV=salary()/Dm().pay-(TOX()*60)+(pref.includes(S.track)?40:0)+tShifts()*1.5;

  if(best&&!TRACKS[best].gig&&score(best)>curV*1.3+50&&Math.random()<0.12){S.seek=best;toast(`🔎 ${CH().name} empieza a buscar trabajo de ${TRACKS[best].n.toLowerCase()}`);}
}

  const nd=S.needs;if(nd.energia<(comp()>=2&&S.ideo!=='apolitica'?16:30)||nd.hambre<25||nd.vejiga<25)return false;
  const W=(S.weather||{}).k;const I=ID(),c=comp();const cand=[];

function inviteHome(p,stay){if(S.sim.work>0)return toast('Ana no está en casa');if((S.res||[]).some(r=>r.pid===p.k))return toast(`${p.n} ya está aquí`);
  const h=S.t/60;const until=stay?(S.day+1)*1440+9*60:S.day*1440+Math.min(23.9*60,S.t+180);
  S.res=S.res||[];const [sx,sy]=simCell();const e=bfs([sx,sy],(x,y)=>x===0||y===0||x===N-1||y===N-1);const ex=e&&e.length?e[e.length-1]:[sx,sy];
  S.res.push({kind:'guest',pid:p.k,x:ex[0]+.5,y:ex[1]+.5,path:[],phase:0,until,stay});talkTo(p);p.rel=Math.min(100,p.rel+6);if(['cita','rollo','pareja'].includes(p.stage))p.love=Math.min(100,p.love+6);
  tally('calls',p.n);toast(`🏠 ${p.n} viene a casa${stay?' (se queda a dormir)':''}`);

function residents(){const list=[...(S.res||[])];const pt=liveIn();const h=S.t/60;const ptWork=pt&&dayType(S.day)==='work'&&h>8.2&&h<17.8;
  if(pt&&!ptWork&&!list.some(r=>r.pid===pt.k)){S.res=S.res||[];const r={kind:'partner',pid:pt.k,x:S.sim.x+1,y:S.sim.y,path:[],phase:0};const [x,y]=simCell();const n=neighborsOf(idx(x,y));if(n.length){r.x=n[0]%N+.5;r.y=(n[0]/N|0)+.5;}S.res.push(r);list.push(r);}
  if(pt&&ptWork)S.res=(S.res||[]).filter(r=>r.kind!=='partner');
  for(const [i,k] of (S.kids||[]).entries()){if(!(S.res||[]).some(r=>r.kid===i)){const [x,y]=simCell();S.res=S.res||[];S.res.push({kind:'kid',kid:i,x:x+.5,y:y+.5,path:[],phase:0});}}
  return S.res||[];}
function updateResidents(gm){
  const list=residents();const [ax,ay]=simCell();const home=!(S.sim.work>0);
  for(const r of list){if(!isFinite(r.x)||!isFinite(r.y)||r.x==null||r.y==null){let c=simCell();if(!walkable(c[0],c[1])){const f=bfs(c,(x,y)=>walkable(x,y));c=f&&f.length?f[f.length-1]:[N>>1,N>>1];}r.x=c[0]+.5;r.y=c[1]+.5;r.path=[];}r.phase=r.phase||0;if(r.path&&r.path.length){const [tx,ty]=r.path[0];if(!walkable(tx,ty)){r.path=[];continue;}npcMove(r,gm*(r.kind==='kid'?.8:1));continue;}
    r.next=(r.next||0)-gm;if(r.next>0)continue;r.next=6+Math.random()*10;
    const [cx,cy]=[Math.floor(r.x),Math.floor(r.y)];let goal;
    if(home&&(r.kind!=='kid'||Math.random()<.6)){const adj=neighborsOf(idx(ax,ay)).filter(j=>!(S.res||[]).some(o=>o!==r&&Math.floor(o.x)===j%N&&Math.floor(o.y)===(j/N|0)));if(adj.length){const j=adj.sort((a,b)=>Math.hypot(a%N-cx,(a/N|0)-cy)-Math.hypot(b%N-cx,(b/N|0)-cy))[0];goal=[j%N,j/N|0];}}
    if(!goal&&Math.random()<.4){for(let t=0;t<12;t++){const x=1+(Math.random()*(N-2)|0),y=1+(Math.random()*(N-2)|0);if(walkable(x,y)&&roomId[idx(x,y)]>=0){goal=[x,y];break;}}}
    if(goal&&(goal[0]!==cx||goal[1]!==cy)){const p=bfs([cx,cy],(x,y)=>x===goal[0]&&y===goal[1]);if(p)r.path=p;}}
  // compañía: sube lo social
  if(home&&list.length){S.needs.social=Math.min(100,S.needs.social+0.05*gm*list.length);for(const r of list){const p=r.pid&&S.people.find(q=>q.k===r.pid);if(p&&Math.random()<0.01*gm){p.rel=Math.min(100,p.rel+0.5);if(isPartner(p)||p.stage==='rollo')p.love=Math.min(100,p.love+0.3);p.last=S.day;}}}
  // la visita se va cuando toca
  S.res=(S.res||[]).filter(r=>!(r.kind==='guest'&&r.until<S.day*1440+S.t));
}
function drawResident(r){
  if(!isFinite(r.x)||!isFinite(r.y)||r.x==null)return;
  const [u,v]=w2v(r.x,r.y);const [bx,by]=P(u,v,0);const near=Math.hypot(r.x-S.sim.x,r.y-S.sim.y)<1.6&&!(S.sim.work>0);
  let ch,name,scale=1;if(r.kind==='kid'){const k=(S.kids||[])[r.kid];if(!k)return;ch=k.ch;name=k.n;scale=kidAge(k)<1?0.42:kidAge(k)<3?0.55:0.68;}else{const p=S.people.find(q=>q.k===r.pid);if(!p)return;ch=p.ch;name=p.n;}
  const saved=anaRT.phase;anaRT.phase=r.phase||0;let front=r.front,right=r.right;
  if(near&&!r.path.length){const [a,b]=w2v(S.sim.x,S.sim.y);right=(a-u)-(b-v)>0;front=(a-u)+(b-v)>-.01;}
  ctx.save();ctx.translate(bx,by);ctx.scale(scale,scale);
  if(r.kind==='kid'&&scale<.5){ctx.fillStyle='#f4f1ea';ctx.beginPath();ctx.ellipse(0,-10,9,7,0,0,Math.PI*2);ctx.fill();circ(1,-18,6,ch.skin);circ(-.5,-19,1,'#3b2a20');circ(3,-19,1,'#3b2a20');}
  else drawAna(0,0,{ch,shirt:ch.shirt,mood:70,front,right,pose:r.path&&r.path.length?'walk':'stand',act:near&&!r.path.length&&r.kind!=='kid'?'talk':null});
  ctx.restore();anaRT.phase=saved;
  if(cam.z>0.7)label((r.kind==='kid'?'🧒 ':r.kind==='partner'?'❤️ ':'')+name,bx,by-(r.kind==='kid'?30:66),'rgba(255,253,248,.9)','#3b3247',8);
}

function ensureHid(p){if(p.hid)return p.hid;const neg=Object.keys(HID).filter(k=>HID[k].neg&&(!HID[k].only||HID[k].only===p.k)&&(!HID[k].cond||HID[k].cond(p)));
  const pos=Object.keys(HID).filter(k=>HID[k].pos&&(!HID[k].cond||HID[k].cond(p)));p.hid=[];
  if(Math.random()<.62&&neg.length)p.hid.push(pickR(neg));if(Math.random()<.55&&pos.length)p.hid.push(pickR(pos));p.rev=p.rev||[];return p.hid;}

function latentOf(){const c=ex();if(!c.latent){const k=Object.keys(LAT).sort(()=>Math.random()-.5);c.latent={hidden:k.slice(0,2),rev:[]};}return c.latent;}

{const dE=TRAIT_DECAY.energia;TRAIT_DECAY.energia=()=>dE()*(T('ansiosa')?1.12:1);const dS=TRAIT_DECAY.social;TRAIT_DECAY.social=()=>dS()*(T('cinica')?.8:1);}

// ---------- presión ideológica ----------
function pushI(k,amt,why){if(!IDEOS[k]||!amt)return;const c=ex();c.drift[k]=(c.drift[k]||0)+amt;if(why&&amt>0){c.why[k]=c.why[k]||{};c.why[k][why]=(c.why[k][why]||0)+amt;}}
const LEANL=()=>isI('anarquista')?'anarquista':isI('marxista')?'marxista':isI('ecologista')?'ecologista':isI('socialdemocrata')?'socialdemocrata':Math.random()<.5?'socialdemocrata':'marxista';
const LEANR=()=>isI('libertaria')?'libertaria':isI('conservadora')?'conservadora':'liberal';
const SHIFT_TXT={
  'L>R':['Ya no se reconoce en las asambleas. Le parecen gente que no ha tenido que pagar una hipoteca.','Dice que ha madurado. Sus antiguas compañeras dicen que se ha acomodado. Las dos cosas pueden ser verdad.'],
  'R>L':['Algo se rompió. Durante años creyó que el esfuerzo bastaba; ahora sabe quién se queda con lo que ella produce.','Ha descubierto que lo que le pasaba no era mala suerte: tenía nombre y apellidos.'],
  '>A':['Se ha quemado. Ni asambleas, ni debates, ni telediario: ahora solo quiere paz.','Ya no cree en nada de eso. Tantas reuniones para nada.'],
  'A>':['Por primera vez en su vida, la política le parece algo que va con ella.','Se acabó mirar hacia otro lado.'],
  'L>L':['Sigue en el mismo lado, pero ya no cree en el mismo camino.'],'R>R':['Sigue en el mismo lado, pero ya no cree en el mismo camino.']};
const WHYTXT={explotacion:'lo que ha visto en el trabajo',despido:'el despido',huelga:'la huelga',pobreza:'no llegar a fin de mes',dinero:'el dinero que ahora tiene',ascenso:'su nuevo puesto',
  pareja:'su pareja',amistades:'su gente',crisis:'la crisis',represion:'la represión',familia:'la familia',cansancio:'el cansancio',vivienda:'la vivienda',cuidados:'los cuidados',derrota:'las derrotas'};
function driftWeekly(){const c=ex(),cur=S.ideo||'apolitica';
  for(const k in c.drift)c.drift[k]*=.965;
  const w=W_(),cl=classOf();
  if(TOX()>.6&&!S.jobless)pushI(isRight()?'socialdemocrata':LEANL(),1.6*TOX(),'explotacion');
  if(S.money<0){c.exp.poor++;pushI(isRight()?(Math.random()<.5?'socialdemocrata':'apolitica'):LEANL(),2.4,'pobreza');}else c.exp.poor=Math.max(0,c.exp.poor-1);
  const rich=S.money>weeklyRent()*25;if(rich){c.exp.rich++;pushI(isI('conservadora')?'conservadora':S.pol.invest==='cripto'?'libertaria':'liberal',1.8,'dinero');}
  if(cl==='mando'||cl==='patrona'||cl==='rentista')pushI(isI('conservadora')?'conservadora':'liberal',2.6,'ascenso');
  if(w.crisis>55){if(isLeft())pushI(LEANL(),1.5,'crisis');else if(isRight())pushI(Math.random()<.5?'conservadora':'libertaria',1.5,'crisis');else pushI(Math.random()<.5?LEANL():'conservadora',1.2,'crisis');}
  if(w.era==='represion'&&isLeft()){if(T('resiliente')||T('combativa'))pushI('anarquista',2,'represion');else pushI('apolitica',2.5,'represion');}
  if((S.kids||[]).length)pushI(Math.random()<.5?'conservadora':'socialdemocrata',.7,'familia');
  // la gente cercana tira de ella
  for(const p of S.people||[]){if(!p.ideo||p.stage==='ex')continue;const cl2=closeTo(p);if(cl2<55)continue;const k=isPartner(p)?2.6:1.1;pushI(p.ideo,k*cl2/100,isPartner(p)?'pareja':'amistades');}
  // quemarse
  if(comp()===3&&c.exp.stress>=3&&!T('combativa'))pushI('apolitica',2,'cansancio');
  // el compromiso pesa: cuanto más militante, más cuesta cambiar
  const hold=95+(S.pol.xp||0)*.8+(comp()-1)*25+(c.drift[cur]||0);
  let best=null,bv=0;for(const k in c.drift){if(k===cur)continue;if(c.drift[k]>bv){bv=c.drift[k];best=k;}}
  if(best&&bv>hold&&!c.dlg&&!c.dq.some(d=>d.id==='ideo'))askDilemma('ideo',{to:best});
  // compromiso: sube con las victorias, baja con el agotamiento
  if(S.ideo!=='apolitica'&&S.pol){if(comp()<3&&c.exp.win>=2&&(T('lider')||T('combativa'))&&Math.random()<.15){S.pol.comp=comp()+1;tell(`Ana ha dado un paso más: ahora es ${L(COMP[S.pol.comp]).toLowerCase()}. Las victorias enganchan.`,ID().e);}
    else if(comp()>1&&c.exp.stress>=4&&!T('combativa')&&Math.random()<.2){S.pol.comp=comp()-1;tell(`Ana se ha retirado un poco: ya no llega a todo. Ahora es ${L(COMP[S.pol.comp]).toLowerCase()}.`,'🪫');}}
}
function topWhy(k){const w=ex().why[k]||{};const e=Object.entries(w).sort((a,b)=>b[1]-a[1])[0];return e?WHYTXT[e[0]]||e[0]:'la vida';}
function changeIdeo(to){const from=S.ideo||'apolitica';const dir=from==='apolitica'?'A>':to==='apolitica'?'>A':isLeft(from)&&isRight(to)?'L>R':isRight(from)&&isLeft(to)?'R>L':isLeft(from)?'L>L':'R>R';
  chapter('ideo_'+S.day,`${IDEOS[from].e} → ${IDEOS[to].e} Ya no es la misma`,`Ha sido ${topWhy(to)}. ${pickR(SHIFT_TXT[dir])} Antes se decía ${IDEOS[from].n.toLowerCase()}; ahora, ${IDEOS[to].n.toLowerCase()}.`);
  S.ideo=to;S.pol.xp=Math.round((S.pol.xp||0)*.3);S.pol.comp=to==='apolitica'?1:Math.max(1,comp()-1);const c=ex();c.drift[from]=(c.drift[from]||0)*.3;c.drift[to]=0;c.why[to]={};
  for(const p of S.people||[])if(p.ideo){if(p.ideo===to)p.rel=Math.min(100,p.rel+6);else if(p.ideo===from&&from!=='apolitica'){p.rel=Math.max(0,p.rel-8);if(closeTo(p)>50)remember(`${p.n} no entiende el cambio de Ana.`);}}
  if(isRight(to)&&S.union&&S.union.member&&Math.random()<.5)leaveUnion();}

// ---------- desgaste de las relaciones ----------
function wearWeekly(){const c=ex(),cl=classOf();let fought=0;
  for(const p of S.people||[]){if(p.stage==='ex'||!p.k)continue;if(/^p/.test(p.k)&&!intimate(p)&&S.day-(p.last||p.metDay||0)>14)p.rel=Math.max(5,p.rel-3);}
  for(const p of S.people||[]){if(p.stage==='ex'||!p.k)continue;ensureHid(p);const close=intimate(p)||closeTo(p)>=55||['madre','amiga'].includes(p.k);if(!close)continue;
    const R={};const add=(k,v)=>{if(v)R[k]=(R[k]||0)+v;};
    for(const h of p.hid){const H=HID[h];if(!H)continue;add(H.why||h,H.w(p));if(H.fx&&intimate(p))H.fx(p);}
    // ideas: más militancia, más choque
    if(p.ideo&&S.ideo&&p.ideo!=='apolitica'&&S.ideo!=='apolitica'&&((isLeft()&&RIGHT.includes(p.ideo))||(isRight()&&LEFT.includes(p.ideo))))add('la política',.8*comp());
    // clase: cuando la vida los pone a cada uno en un lado
    if(intimate(p)){if(RICHJOB.has(p.job)&&['precaria','parada'].includes(cl))add('el dinero',1);if(['mando','patrona'].includes(cl)&&isLeft(p.ideo))add('su trabajo',1.5);}
    // tiempo: militar, trabajar de más o estar fuera tiene un precio en casa
    const militancy=(c.wk.outK.militancia||0)+(c.wk.outK.sindicato||0)+(c.wk.outK.piquete||0)+(c.wk.outK.manifestacion||0);
    if(intimate(p)&&militancy>=2&&!(p.ideo===S.ideo))add('la militancia',militancy*.8);
    if(intimate(p)&&S.money<0)add('el dinero',1.4);
    if(intimate(p)&&mood()<35)add('el mal humor',1);
    if(intimate(p)&&(S.kids||[]).some(k=>kidAge(k)<3)&&!(p.rev||[]).includes('cuidadora')&&!p.hid.includes('cuidadora'))add('los cuidados',1.2);
    // lo que sí funciona: tiempo juntos, mismas ideas
    if(S.day-(p.last||0)<5)add('_bien',-1.2);if(p.ideo===S.ideo&&S.ideo!=='apolitica')add('_bien',-.8*comp());
    const tot=Object.values(R).reduce((a,b)=>a+b,0);const keep=T('rencorosa')?.97:.9;
    p.wear=clamp((p.wear||0)*keep+tot,0,100);
    const worst=Object.entries(R).filter(e=>e[0][0]!=='_'&&e[1]>0).sort((a,b)=>b[1]-a[1])[0];p.wearWhy=worst?worst[0]:null;
    if(intimate(p))p.love=clamp(Math.min(p.love-p.wear/12+(tot<0?.6:0),100-p.wear*.8),0,100);else p.rel=clamp(p.rel-p.wear/32,0,100);
    if(!fought&&p.wear>(intimate(p)?28:45)&&worst&&Math.random()<.3+(T('genio')?.2:0)){fought=1;tell(fight(p,worst[0]),'😤');}
    if(isPartner(p)&&p.wear>=68&&!c.dlg&&!c.dq.some(d=>d.id==='crisis'))askDilemma('crisis',{p:p.k});
    // revelar
    if(S.day-(p.metDay||0)>=6)for(const h of p.hid){if((p.rev||[]).includes(h))continue;const H=HID[h];if(!H)continue;if(H.need&&!(H.rev&&H.rev(p)))continue;const ch=.03+closeTo(p)/100*.1+(H.rev&&H.rev(p)?.22:0);
      if(Math.random()<ch){p.rev=p.rev||[];p.rev.push(h);tell(H.txt(p),H.e,'big');if(H.onRev)H.onRev(p);remember(`Descubrió algo de ${p.n}: ${H.n.toLowerCase()}.`);break;}}}}
function fight(p,why){const n=p.n;const T_={'la militancia':[`Bronca con ${n}: «el sindicato te importa más que esta casa».`,`${n} ha cenado solo otra vez. Ana estaba en una asamblea.`.replace('solo',p.g==='f'?'sola':'solo')],
  'el dinero':[`Discusión con ${n} por dinero. Otra vez. Nadie levanta la voz por cien euros si le sobran.`,`${n} y Ana han discutido por quién paga qué. No era por el dinero, o sí.`],
  'la política':[`Cena tensa con ${n}. Empezó hablando de la huelga y acabó en «tú no sabes lo que es trabajar».`,`${n} ha cambiado de canal cuando salía la manifestación. Ana lo ha vuelto a poner.`],
  'su trabajo':[`${n} le ha soltado: «¿y ahora eres tú la que manda?». Duele porque tiene parte de razón.`,`${n} no soporta cómo habla Ana del trabajo últimamente.`],
  'su carrera':[`${n} ha vuelto a cancelar la cena: «reunión de última hora». Es la tercera esta semana.`,`${n} habla de su ascenso como si fuera de los dos. Las renuncias, en cambio, siempre las pone Ana.`],
  'los celos':[`${n} quería saber con quién estuvo Ana el sábado. Con detalles.`],'los cuidados':[`${n} dice que ayuda en casa. Ana lleva la cuenta de quién se levanta de noche.`],
  'cuidar sin descanso':[`Ana está agotada de sostener a ${n}. Y se siente culpable por estarlo.`],'la confianza':[`Ana ya no cree lo que le dice ${n}. Ni lo bueno.`],'el mal humor':[`Ana lleva días de mal humor y ${n} se lo está comiendo todo.`],'la huelga':[`Ana no le dirige la palabra a ${n} desde la huelga.`]};
  return pickR(T_[why]||[`${n} y Ana no están en su mejor momento: ${why}.`]);}

// ---------- contradicciones de clase ----------
function contraWeekly(){const c=ex(),cl=classOf();let d=-4;
  if(isLeft()){if(cl==='mando')d+=6+comp()*3;if(cl==='patrona')d+=7+comp()*3;if(cl==='rentista')d+=6+comp()*3;}
  if(isI('libertaria','liberal')){if(cl==='parada'&&S.paroWeeks>0)d+=4;if(S.track==='funcion')d+=3;}
  if(isI('conservadora')&&S.rentStrike)d+=4;

function triggersWeekly(){const c=ex();
  // se acaba de convertir en mando
  const boss=isBoss();if(boss&&S.career>c.lastCareer&&isLeft()&&!c.dq.some(d=>d.id==='ascenso'))askDilemma('ascenso',{});c.lastCareer=S.career;
  if(boss&&Math.random()<(Dm().soul?.06:.03)*(1+TOX()))askDilemma('despedir',{});
  // números rojos
  if(S.money<-30&&!c.dq.some(d=>d.id==='prestamo')&&!(S.cutBelt>S.day)){const f=(S.people||[]).filter(p=>p.stage!=='ex'&&closeTo(p)>=50).sort((a,b)=>closeTo(b)-closeTo(a))[0];askDilemma('prestamo',{p:f?f.k:null,m:Math.round(Math.max(150,-S.money+100)/10)*10});}
  // la pareja harta de la militancia
  const pt=partner();if(pt&&comp()>=2&&S.ideo!=='apolitica'&&pt.ideo!==S.ideo&&(pt.wear||0)>=40&&pt.wearWhy==='la militancia'&&Math.random()<.35)askDilemma('militancia',{p:pt.k});
  // despido: memoria de clase
  if(S.jobless&&!c.lastJobless){c.exp.loss++;pushI(isRight()?'socialdemocrata':LEANL(),18,'despido');}c.lastJobless=!!S.jobless;
  // capítulos recientes empujan ideas
  const st=storyState();for(const [id,ch] of Object.entries(st.chap)){if(c.chapSeen[id])continue;c.chapSeen[id]=1;
    if(id==='huelgaW'){c.exp.win++;pushI(isI('anarquista')?'anarquista':'marxista',25,'huelga');}
    else if(id==='juicio'){pushI('socialdemocrata',15,'huelga');}
    else if(id==='inquilinas'){pushI('anarquista',15,'vivienda');c.exp.solid++;}
    else if(/^promo|^top$/.test(id)){pushI('liberal',8,'ascenso');}
    else if(id==='boda'||/^nace_/.test(id)){pushI('conservadora',5,'familia');pushI('socialdemocrata',3,'cuidados');}
    else if(id==='ruptura'){c.exp.loss++;}
    else if(id==='comedor'){pushI(LEANL(),12,'pobreza');}}
  c.wk={out:0,outK:{}};}

const BOSST={oficina:['la directora','el director'],super:['la encargada','el encargado'],hosteleria:['la dueña','el dueño'],obra:['la capataz','el capataz'],cuidados:['la supervisora','el supervisor'],tech:['la CTO','el CTO'],funcion:['la jefa de servicio','el jefe de servicio'],reparto:['la app','la app'],arte:['la dueña de la sala','el dueño de la sala']};
function boss(){const o=office();if(!o.boss){const g=Math.random()<.5?'f':'m';o.boss={n:pickR(BOSSN[g]),g};}return o.boss;}
const bossT=()=>{const b=boss();const t=(BOSST[S.track]||['la jefa','el jefe'])[b.g==='f'?0:1];return S.track==='reparto'?'la app':`${t}, ${b.n},`;};
const bossS=()=>S.track==='reparto'?'la app':boss().n;
const compiN=()=>{const c=P_('compi');return c?c.n:'una compañera';};
const weekPay=()=>Math.round(salary()*TR().days.length);
const WP=()=>Math.max(150,weekPay());
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
// ---------- estado de la temporada ----------
function TM(){if(!S.tmp){S.tmp=newSeason(1,S.day||1);if((S.day||1)>5){S.tmp.done.primer=S.day;S.tmp.done.semana=S.day;}}return S.tmp;}
function newSeason(n,start){const j=(a,b)=>a+Math.floor(Math.random()*(b-a+1));return {n,start,beats:{primer:2,semana:8,incidente:j(11,14),golpe:j(19,24),encrucijada:j(30,35),personal:j(41,46),eco:j(50,54),epilogo:60},done:{},choices:[],used:S.tmp?S.tmp.used:{},money0:Math.round(S.money),career0:S.career,track0:S.track,ideo0:S.ideo,jobless0:!!S.jobless};}
function useVar(key,list){const u=TM().used;u[key]=u[key]||[];let c=list.filter(v=>!u[key].includes(v.id));if(!c.length){u[key]=[];c=list;}const v=pickR(c);u[key].push(v.id);return v;}
function chose(txt){TM().choices.push(txt);}
function seasonDaily(){const t=TM();const d=S.day-t.start+1;
  for(const [k,at] of Object.entries(t.beats)){if(t.done[k]||d<at)continue;t.done[k]=S.day;try{BEATS[k]();}catch(e){console.error('beat',k,e);}break;}}
// ---------- hitos ----------
const BEATS={
  primer(){if(TM().n>1||S.jobless)return;const tx=TOX(),b=bossT(),c=compiN();let x;
    if(TR().self)x=`Primera venta en ${office().n}. ${fmt(Math.round(WP()*.03))}. Ana se ha quedado mirando el ticket como si fuera un diploma. Luego ha hecho cuentas: hacen falta cuarenta como ese cada día.`;
    else if(TR().coop)x=`Asamblea de bienvenida en ${office().n}. Nadie le ha dicho qué hacer: le han preguntado qué sabe hacer. Ha tardado en contestar; no estaba acostumbrada.`;
    else if(S.track==='reparto')x=`Primer día con la mochila. La app le ha dado nueve pedidos, una tormenta y una valoración de tres estrellas por «tardar». Ha ganado ${fmt(Math.round(salary()*.8))} y se ha pagado la gasolina.`;
    else if(tx>.6)x=`Primer día de verdad en ${office().n}. Nadie le ha explicado nada. A las ${SHIFT.end}:00 ha recogido y ${b} le ha dicho sin mirarla: «aquí se sale cuando se acaba». ${c} le ha hecho un gesto: ya te acostumbras.`;
    else if(tx>.35)x=`Primer día de verdad en ${office().n}. ${c} le ha enseñado dónde está todo y a quién no conviene llevar la contraria. ${cap(b)} parece normal. «Parece», ha dicho ${c}.`;
    else x=`Primer día de verdad en ${office().n}. ${cap(b)} se ha presentado y le ha preguntado si necesitaba algo. ${c} le ha dicho que aquí se está bien, «dentro de lo que cabe».`;
    chapter('primer_dia','El primer día de verdad',x.replace('mirarla',ga('mirarla','mirarlo','mirarle')));},
  semana(){const r=weeklyRent(),p=S.jobless?0:weekPay();const left=Math.round(S.money);
    let x=`Primera semana. ${S.jobless?'Sin trabajo todavía':'Ha cobrado '+fmt(p)}; el alquiler se lleva ${fmt(r)}. Quedan ${fmt(left)} para comer, la luz y lo que surja.`;
    x+=left<r*1.5?' Si pasa cualquier cosa, no hay colchón.':left<r*4?' Llega, pero sin alegrías.':' Por ahora, respira.';
    if(!S.jobless&&r>p*.45)x+=` Casi la mitad de lo que gana se va a la casa. Alguien cobra ese alquiler sin trabajar una hora.`;
    tell(x,'🧾');},
  incidente(){if(S.jobless){tell('Semana de currículos. Tres respuestas automáticas y un «ya te llamaremos».','📭');return;}
    const V=INCID[TR().self?'negocio':TR().coop?'coop':S.track]||INCID.oficina;const v=useVar('inc',V);askDilemma('incidente',{v:v.id});},
  golpe(){const V=GOLPES.filter(g=>!g.c||g.c());const v=useVar('golpe',V);const m=Math.round(v.m()*PM());askDilemma('golpe',{v:v.id,m});},
  encrucijada(){let id;const o=S.jobless?null:office();
    if(S.jobless)id='entrevista';else if(TR().self||TR().coop)id='cliente';else if((o.org>=25||(S.union&&S.union.member)||(isLeft()&&comp()>=2))&&!(S.strike&&S.strike.on))id='asamblea';else if((S.rep??70)>=62&&S.career+1<CAREER.length&&!TR().gig)id='envenenado';else id='oferta';
    askDilemma(id,{});},
  personal(){const V=PERSONAL.filter(p=>!p.c||p.c());const v=useVar('pers',V);askDilemma('personal',{v:v.id});},
  eco(){const t=TM();const c=t.choices;if(!c.length)return;tell(`Ana repasa estos dos meses: ${c.slice(-3).map(x=>x.toLowerCase()).join('; ')}. ${pickR(['No sabe si volvería a hacer lo mismo.','Lo volvería a hacer.','Cada cosa le ha costado algo.'])}`,'🪞');},
  epilogo(){const t=TM();const dm=Math.round(S.money)-t.money0;const same=S.track===t.track0&&S.career===t.career0&&!S.jobless&&!t.jobless0;
    const near=[...(S.people||[])].filter(p=>p.stage!=='ex').sort((a,b)=>closeTo(b)-closeTo(a)).slice(0,2).map(p=>p.n);
    let x=`Han pasado dos meses. ${dm>=0?'Tiene '+fmt(dm)+' más que al empezar':'Tiene '+fmt(-dm)+' menos que al empezar'}. `;
    x+=S.jobless?'Está sin trabajo. ':same?`Sigue de ${L(CAREER[S.career].t).toLowerCase()} en ${office().n}. `:`Ahora es ${L(CAREER[S.career].t).toLowerCase()}${S.office?' en '+office().n:''}. `;
    if(S.ideo!==t.ideo0)x+=`Ya no piensa como antes: se siente ${IDEOS[S.ideo].n.toLowerCase()}. `;
    if(near.length)x+=`Si algo se tuerce, llamará a ${near.join(' o a ')}. `;
    if(t.choices.length)x+=`Decidió: ${t.choices.slice(-4).map(c=>c.toLowerCase()).join('; ')}. `;
    x+=same&&dm<=0?'Sesenta días de trabajo para estar donde estaba. La diferencia se la ha quedado alguien.':ex().exp.win>0?'Ha ganado alguna. Sabe que se puede.':dm>weeklyRent()*3?'Ha ahorrado. Ya veremos cuánto dura.':'Sigue en pie. Que no es poco.';
    chapter('temporada_'+t.n,`Temporada ${t.n}: dos meses`,x);
    const w=W_();w.crisis=Math.min(100,w.crisis+(Dm().soul?8:4));S.tmp=newSeason(t.n+1,S.day+1);toast(`📖 Empieza la temporada ${t.n+1}`,true);}};

  cuidados:[{id:'doble',x:()=>`${compiN()} está de baja y no la sustituyen. Ana lleva su planta y la de ${compiN()}: veinte personas que asear, dar de comer y acostar.`},{id:'ratio',x:()=>`Esta noche hay una auxiliar para treinta residentes. Una señora se ha caído mientras Ana atendía a otra. El parte lo firmará Ana.`},{id:'guantes',x:()=>`Se han acabado los guantes. ${cap(bossT())} dice que «se estiren». Ana lleva los suyos de casa.`}],
  tech:[{id:'sprint',x:()=>`«Somos una familia»: ${cap(bossT())} anuncia un sprint de fin de semana para llegar al lanzamiento. Sin pagar, «con pizza».`},{id:'guardia',x:()=>`Guardia de madrugada sin cobrar. El servidor se ha caído a las tres y Ana ha estado hasta las seis. A las diez tenía reunión.`}],

  arte:[{id:'consumo',x:()=>`${cap(bossT())} le paga el concierto en consumiciones. «Es visibilidad». La sala estaba llena.`},{id:'bolo',x:()=>`Le cancelan el bolo del sábado el viernes por la noche. Ya había rechazado otro.`}],

const INC_TXT=k=>{for(const V of Object.values(INCID)){const v=V.find(x=>x.id===k);if(v)return v.x();}return '';};

  {id:'caldera',m:()=>WP()*(.45+Math.random()*.3)/PM(),x:m=>`La caldera ha muerto. El casero dice que «el mantenimiento es cosa del inquilino». Arreglarla: ${fmt(m)}.`,fx:m=>{S.money-=m;}},

  {id:'luz',m:()=>WP()*(.22+Math.random()*.2)/PM(),x:m=>`Factura de la luz: ${fmt(m)}, el doble que el mes pasado. La compañía ha ganado mil millones este trimestre.`,fx:m=>{S.money-=m;}},

      {t:'Pedir permiso en el trabajo',s:'Depende de quién mande.',f:()=>{if(TOX()<.45||TR().coop||S.track==='funcion'){m.rel=Math.min(100,m.rel+12);tell(`Le han dado cinco días por cuidado de familiar. Ni una pega.`,'📄');}else{S.rep=Math.max(0,(S.rep??70)-6);tell(`${bossS()}: «¿Y quién te cubre? Aquí todos tenemos madre». Al final ha ido por las tardes, después del turno. Dos semanas sin dormir.`,'😮‍💨');ex().exp.stress++;grieve(10);}}},

function drawEntGround(night){

  wflat(-40,-40,N+34,N+20,-.02,shade(L,.86));
  // manzanas de alrededor en césped más apagado
  wflat(-24,-24,N+6,N+6,0,g);

  const pav='#d8d2c4',pavN=mixHex(pav,'#222',night*.35);const asf=mixHex('#5d6168','#222',night*.3);
  wflat(ENT_STREET.far,N,N+5.5,N+1.5,.03,pavN);wflat(ENT_STREET.far,N+4.5,N+5.5,N+5.5,.03,pavN);
  wflat(N,ENT_STREET.far,N+1.5,N+5.5,.03,pavN);wflat(N+4.5,ENT_STREET.far,N+5.5,N+5.5,.03,pavN);

  wflat(ENT_STREET.far,N+1.5,N+4.5,N+4.5,.04,asf);wflat(N+1.5,ENT_STREET.far,N+4.5,N+4.5,.04,asf);
  // líneas discontinuas
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.3;ctx.setLineDash([7,9]);
  ctx.beginPath();let p=wp(ENT_STREET.far,N+3,.06);ctx.moveTo(p[0],p[1]);p=wp(N+3,N+3,.06);ctx.lineTo(p[0],p[1]);p=wp(N+3,ENT_STREET.far,.06);ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.restore();
  // paso de cebra frente a la casa y en la otra calle
  for(let k=0;k<5;k++){wflat(N/2-1.6+k*.7,N+1.6,N/2-1.2+k*.7,N+4.4,.07,'rgba(255,255,255,.75)');wflat(N+1.6,N/2-1.6+k*.7,N+4.4,N/2-1.2+k*.7,.07,'rgba(255,255,255,.75)');}
  // bordillo de la parcela
  const [u0,v0,u1,v1]=vrect([0,0,N,N]);prism(u0,v0,u1,v1,-3,0,shade(L,.75));

  const pk=ENT_HOUSES.find(h=>h.park);wflat(pk.r[0],pk.r[1],pk.r[2],pk.r[3],.05,shade(L,1.02));

}

function nextStep(job){return job.steps.findIndex(st=>!st.done);}
function stepCell(st){

      else toast(`🔁 ${OBJ[o.t].n} nueva ${TIERS[q].e} ${TIERS[q].n} instalada${byNpc?'':' por Ana'}`);sfx('build');break;}

function confettiSmall(x,y){burst('spark',x,y,20,10,.7,{vz:110,life:1,col:['#ffd166','#5bc0be','#ff8a5b'][Math.random()*3|0]});}
function finishJob(){

  if(j.moves&&j.purpose){
    const steps=[];for(const t of j.moves)for(const i of findObjs((d,tt)=>tt===t)){const rr=rooms[roomId[i]];if(!rr||rr.purpose!==j.purpose)steps.push({k:'move',v:t,from:i,zone:j.purpose,i:null});}
    if(steps.length){const mj={key:'move',name:'Llevar muebles a '+ZONES[j.purpose].n.toLowerCase(),emoji:'📦',why:'',kind:'move',steps,total:steps.length};

      else if(S.money>=lab){S.job={...mj,who:'builder'};if(npcHere&&npcHere.state!=='leaving'){S.money-=lab;toast(`📦 ${npcHere.name} se queda a trasladar ${j.moves.map(t=>OBJ[t].n.toLowerCase()).join(' y ')} · ${fmt(lab)}`);}else if(spawnBuilder()){S.money-=lab;toast(`📦 La cooperativa traslada ${j.moves.map(t=>OBJ[t].n.toLowerCase()).join(' y ')} · ${fmt(lab)}`);}else S.job=null;}
      return;}
  }
  tally('built',j.name);if(j.purpose&&j.kind==='build')chapter('room1','Hacer hogar',`${CH().name} ha levantado su primera habitación nueva: ${ZONES[j.purpose]?ZONES[j.purpose].n.toLowerCase():'un cuarto'}. Huele a pintura fresca y a futuro.`);
  toast(`✅ Terminado: ${j.emoji} ${j.name}${j.who==='builder'&&S.npc?' · '+S.npc.name+' se despide 👋':''}`,true);sfx('level');
  if(!S.sim.work){confetti(S.sim.x,S.sim.y,50);popBubble('🎉');}
  if(S.npc)npcLeave();
}

function doJobStep(){
  const job=S.job;if(!job||job.who!=='ana'||job.paused&&S.money<stepCost(job.steps[nextStep(job)]||{k:'x'}))return false;
  const j=nextStep(job);if(j<0){finishJob();return false;}
  const st=job.steps[j];
  if(st.k==='rezone'){execStep(job,j,false);return false;}
  const i=stepCell(st);
  if(i==null){if(st.k==='move'&&(st.tries=(st.tries||0)+1)<4){job.steps.splice(j,1);job.steps.push(st);return false;}st.done=true;st.skipped=true;return false;}
  const tg=standTargets(i);const p=tg.size?bfs(simCell(),(a,b)=>tg.has(idx(a,b))):null;
  if(!p){st.tries=(st.tries||0)+1;if(st.tries>3){st.done=true;st.skipped=true;}return false;}
  const s=S.sim;s.path=p;s.target=null;s.buildJ=j;s.cmd=false;s.stuck=false;
  if(!p.length)startBuild();
  return true;
}
function startBuild(){
  const s=S.sim,job=S.job;const j=s.buildJ;s.buildJ=null;if(!job||j==null||job.steps[j].done)return;
  const st=job.steps[j];const [sk]=stepReq(st);const base=st.k==='craft'?30+CRAFT[st.v][2]*12:STEP_T[st.k];const dur=base*Math.max(0.5,1.3-0.07*lvl(sk));
  s.use={type:'_build',i:st.i,j,t:0,dur,sk};
}
// ----- albañil -----
function spawnBuilder(){
  const j=nextStep(S.job);if(j<0)return false;const st=S.job.steps[j];const i=stepCell(st);if(i==null)return false;
  const tg=standTargets(i);const edges=[];
  for(let k=0;k<N;k++)for(const [x,y] of [[k,0],[k,N-1],[0,k],[N-1,k]])if(walkable(x,y))edges.push([x,y]);
  edges.sort((a,b)=>Math.hypot(a[0]-(i%N),a[1]-(i/N|0))-Math.hypot(b[0]-(i%N),b[1]-(i/N|0)));
  for(const e of edges.slice(0,30)){const p=bfs(e,(a,b)=>tg.has(idx(a,b)));if(p){S.npc={name:BUILDERS[Math.random()*BUILDERS.length|0],x:e[0]+.5,y:e[1]+.5,path:[],work:null,state:'working',phase:0,right:true,front:true};return true;}}
  return false;
}
function npcLeave(){const n=S.npc;if(!n)return;n.state='leaving';n.work=null;const p=bfs([Math.floor(n.x),Math.floor(n.y)],(x,y)=>x===0||y===0||x===N-1||y===N-1);n.path=p||[];if(!p)S.npc=null;}
function npcMove(n,gm){
  const [tx,ty]=n.path[0];const dx=tx+.5-n.x,dy=ty+.5-n.y,dist=Math.hypot(dx,dy),step=0.6*gm;
  if(dist>0.01){const [a,b]=w2v(n.x,n.y),[c,d]=w2v(n.x+dx,n.y+dy);const du=c-a,dv=d-b;if(Math.abs(du-dv)>.01)n.right=du-dv>0;n.front=du+dv>-.01;}
  n.phase+=Math.min(step,dist)*11;
  if(dist<=step){n.x=tx+.5;n.y=ty+.5;n.path.shift();}else{n.x+=dx/dist*step;n.y+=dy/dist*step;}
}
function updateNPC(gm){
  const n=S.npc;if(!n)return;
  if(n.state==='leaving'){if(n.path.length)npcMove(n,gm);else S.npc=null;return;}
  const job=S.job;if(!job||job.who!=='builder'){npcLeave();return;}
  if(n.work){
    n.work.t+=gm;
    if(n.work.t>=n.work.dur){const st=job.steps[n.work.j];n.work=null;if(st&&!st.done)execStep(job,job.steps.indexOf(st),true);}
    return;
  }
  if(n.path.length){
    const [tx,ty]=n.path[0];if(!walkable(tx,ty)&&!(Math.floor(n.x)===tx&&Math.floor(n.y)===ty)){n.path=[];return;}
    npcMove(n,gm);if(!n.path.length&&n.goJ!=null){const st=job.steps[n.goJ];if(st&&!st.done)n.work={j:n.goJ,t:0,dur:STEP_T[st.k]*0.45};n.goJ=null;}
    return;
  }
  if(job.paused&&S.money<stepCost(job.steps[nextStep(job)]||{k:'x'}))return;
  const j=nextStep(job);if(j<0){finishJob();return;}
  const st=job.steps[j];if(st.k==='rezone'){execStep(job,j,true);return;}const i=stepCell(st);if(i==null){if(st.k==='move'&&(st.tries=(st.tries||0)+1)<4){job.steps.splice(j,1);job.steps.push(st);return;}st.done=true;return;}
  const tg=standTargets(i);const p=tg.size?bfs([Math.floor(n.x),Math.floor(n.y)],(a,b)=>tg.has(idx(a,b))):null;
  if(!p){st.tries=(st.tries||0)+1;if(st.tries>3)st.done=true;return;}
  if(p.length){n.path=p;n.goJ=j;}else n.work={j,t:0,dur:STEP_T[st.k]*0.45};
}
function cancelJob(){if(!S.job)return;S.job=null;S.want=null;S.wantDay=S.day;if(S.npc)npcLeave();const s=S.sim;if(s.use&&s.use.type==='_build')s.use=null;s.buildJ=null;toast('Obra cancelada. Lo ya construido se queda.');}

let undoStack=[],redoStack=[],stroke=null;

function restore(str){const [f,w,c,o]=JSON.parse(str);S.floor=f;S.wall=w;S.wcol=c;S.obj=o;dirty();const s=S.sim;s.path=[];s.target=null;if(s.use&&s.use.i!=null&&!S.obj[s.use.i])s.use=null;ensureSimFree();}
function beginStroke(){if(!stroke)stroke={before:snap(),m0:S.money};}
function endStroke(){
  if(!stroke)return;const after=snap();
  if(after!==stroke.before){stroke.after=after;stroke.spent=stroke.m0-S.money;undoStack.push(stroke);if(undoStack.length>60)undoStack.shift();redoStack=[];dirty();}

function undo(){returnHeld();const st=undoStack.pop();if(!st)return;restore(st.before);S.money+=st.spent;redoStack.push(st);sfx('undo');bumpMoney();updateUR();}
function redo(){const st=redoStack[redoStack.length-1];if(!st)return;if(S.money<st.spent){toast('No te llega el dinero para rehacer 💸');sfx('bad');return;}redoStack.pop();restore(st.after);S.money-=st.spent;undoStack.push(st);sfx('undo');bumpMoney();updateUR();}

function canApply(x,y,t){
  if(!t||!inb(x,y))return false;
  const i=idx(x,y);const [sx,sy]=simCell();const simHere=!S.sim.work&&sx===x&&sy===y;
  const k=t.kind,water=FLOORS[S.floor[i]].water;
  if(k==='floor'){if(S.floor[i]===t.v)return false;if(FLOORS[t.v].water)return !S.wall[i]&&!S.obj[i]&&!simHere;return true;}
  if(k==='wall'||k==='fence')return !S.wall[i]&&!S.obj[i]&&!simHere&&!water;
  if(k==='door')return S.wall[i]===1||S.wall[i]===3||S.wall[i]===4;
  if(k==='win')return S.wall[i]===1||S.wall[i]===2;
  if(k==='paint')return S.wall[i]>0&&(S.wcol[i]||0)!==t.v;
  if(k==='obj')return !S.wall[i]&&!S.obj[i]&&!simHere&&!water&&(t.v!=='compu'||compuFits(x,y));
  if(k==='rot')return !!S.obj[i];
  if(k==='craft')return !S.wall[i]&&!S.obj[i]&&!simHere&&!water&&!jobCells().has(i);
  if(k==='move')return S.held?(!S.wall[i]&&!S.obj[i]&&!simHere&&!water):!!S.obj[i];
  if(k==='del')return !!(S.obj[i]||S.wall[i]||S.floor[i]);
  return false;
}
function costOf(x,y,t){
  const k=t.kind;
  const pm=PM();if(k==='floor')return Math.round(FLOORS[t.v].p*pm);if(k==='wall')return Math.round(20*pm);if(k==='fence')return Math.round(12*pm);if(k==='door')return Math.round(60*pm);if(k==='win')return Math.round(80*pm);if(k==='paint')return Math.round(5*pm);if(k==='obj')return priceOf(t.v,t.q);return 0;
}
let lastPoorToast=0;
function pay(c){if(S.money<c){if(performance.now()-lastPoorToast>1500){toast('No te llega el dinero 💸 ¡A trabajar!');sfx('bad');lastPoorToast=performance.now();}return false;}S.money-=c;return true;}

function apply(x,y,t=tool,quiet){

    const cj=craftJob(t.v,i,true);
    if(S.job){if(S.job.who!=='ana'){toast('Hay una obra de la cooperativa en marcha; espera a que termine');return false;}S.job.steps.push(...cj.steps);S.job.total+=2;}
    else S.job={...cj,who:'ana',total:2};

  if(k==='floor'){S.floor[i]=t.v;}

    else{S.held={...S.obj[i],from:i};S.obj[i]=null;hint.textContent=`Llevas: ${OBJ[S.held.t].e||'🌿'} ${OBJ[S.held.t].n} · toca dónde dejarlo`;}
  }

  else if(k==='floor'){animStart(i,'floor');if(!quiet)burst('dust',px,py,1,3,.4,{vz:6,life:.5,size:.6});}
  else if(k==='paint'){burst('spark',px,py,30,6,.5,{vz:60,life:.7,col:WALLCOLS[t.v][0]});}
  else if(k==='del'){burst('dust',px,py,8,10,.9,{vz:20,life:.8});burst('chip',px,py,10,delWhat==='obj'?8:5,.8,{vz:120,life:1,col:'#c9b79c'});}
  if(!quiet){if(S.money<m0)floatText('-'+fmt(m0-S.money),px,py,30,'#c0392b');else if(S.money>m0)floatText('+'+fmt(S.money-m0),px,py,30,'#2e8b57');}
  if(!quiet)sfx(k==='del'?'sell':k==='move'||k==='rot'?'pick':k==='floor'||k==='paint'?'tap':'place');
  ensureSimFree();
  const s=S.sim;if(s.path.some(([a,b])=>!walkable(a,b))){s.path=[];s.target=null;s.think=0;if(s.leaving)goWork(true);}
  return true;
}
function returnHeld(){
  if(!S.held)return;const i=S.held.from;
  if(!S.obj[i]&&!S.wall[i])S.obj[i]={t:S.held.t,r:S.held.r,q:S.held.q??3,c:S.held.c??100};else S.money+=priceOf(S.held.t,S.held.q);

// herramientas de arrastre: habitación (rect con paredes), pared/valla (línea), suelo (rectángulo)
const DRAG_KINDS=['room','wall','fence','floor'];
function shapeCells(a,b,kind){
  const cells=[];
  if(kind==='wall'||kind==='fence'){
    const dx=b[0]-a[0],dy=b[1]-a[1];
    if(Math.abs(dx)>=Math.abs(dy)){const s=Math.sign(dx)||1;for(let k=0;k<=Math.abs(dx);k++)cells.push([a[0]+k*s,a[1]]);}
    else{const s=Math.sign(dy);for(let k=0;k<=Math.abs(dy);k++)cells.push([a[0],a[1]+k*s]);}
    return {cells,w:cells.length,h:1};
  }
  const x0=Math.max(0,Math.min(a[0],b[0])),x1=Math.min(N-1,Math.max(a[0],b[0])),y0=Math.max(0,Math.min(a[1],b[1])),y1=Math.min(N-1,Math.max(a[1],b[1]));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)cells.push([x,y,x===x0||x===x1||y===y0||y===y1]);
  return {cells,w:x1-x0+1,h:y1-y0+1};
}
function buildPreview(a,b){
  const k=tool.kind;const sh=shapeCells(a,b,k);
  const pv={walls:new Map(),floors:new Map(),bad:new Set(),cost:0,label:''};
  if(k==='wall'||k==='fence'){
    const t={kind:k};
    for(const [x,y] of sh.cells){if(!inb(x,y))continue;const i=idx(x,y);if(S.wall[i])continue;pv.walls.set(i,k==='fence'?4:1);if(canApply(x,y,t))pv.cost+=costOf(x,y,t);else pv.bad.add(i);}
    pv.label=`${sh.w} ${k==='fence'?'valla':'pared'}${sh.w>1?(k==='fence'?'s':'es'):''}`;
  } else if(k==='floor'){
    for(const [x,y] of sh.cells){const i=idx(x,y);if(canApply(x,y,tool)){pv.floors.set(i,tool.v);pv.cost+=Math.round(FLOORS[tool.v].p*PM());}}
    pv.label=`${sh.w}×${sh.h} ${FLOORS[tool.v].n.toLowerCase()}`;
  } else if(k==='room'){
    const wt={kind:'wall'},ft={kind:'floor',v:lastFloor};
    for(const [x,y,edge] of sh.cells){const i=idx(x,y);
      if(edge&&sh.w>1&&sh.h>1){if(S.wall[i])continue;pv.walls.set(i,1);if(canApply(x,y,wt))pv.cost+=Math.round(20*PM());else pv.bad.add(i);}
      else if(canApply(x,y,ft)&&!S.wall[i]){pv.floors.set(i,lastFloor);pv.cost+=Math.round(FLOORS[lastFloor].p*PM());}
    }
    if(sh.w<3||sh.h<3)pv.label='Arrastra más grande (mín. 3×3)';
    else pv.label=`Habitación ${sh.w-2}×${sh.h-2} · ${(sh.w-2)*(sh.h-2)*4} m²`;
    pv.small=sh.w<3||sh.h<3;
  }
  return pv;
}
function commitPreview(){

  beginStroke();let n=0,fail=false;const mStart=S.money;let lastI=null;

  ord=0;
