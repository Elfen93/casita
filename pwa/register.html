<script>if('serviceWorker' in navigator){let __rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(__rl)return;__rl=true;location.reload();});
function __upd(w){if(document.getElementById('updbtn'))return;const b=document.createElement('button');b.id='updbtn';b.textContent='⬆️ Versión nueva · toca para actualizar';b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:99;background:#ff8a5b;color:#fff;border:0;border-radius:14px;padding:12px 18px;font:900 14px Nunito,system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;pointer-events:auto';b.onclick=()=>{b.textContent='Actualizando…';try{w&&w.postMessage('skip');}catch(e){}setTimeout(()=>location.reload(),1200);};document.body.appendChild(b);}
addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{if(r.waiting&&navigator.serviceWorker.controller)__upd(r.waiting);r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)__upd(w);});});window.__swr=r;setInterval(()=>r.update().catch(()=>{}),10*60*1000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{});});}).catch(()=>{});});}</script>
